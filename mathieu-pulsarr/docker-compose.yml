version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-pulsarr_server_1
      APP_PORT: 3003

  server:
    image: lakker/pulsarr:1.1.6@sha256:4830936b1d77ca321ab2d8cdbf734f5feee35c65e99b0264569df5816cb49dcc
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
      - baseUrl=http://mathieu-pulsarr_server_1
      - port=3003
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
    restart: on-failure
