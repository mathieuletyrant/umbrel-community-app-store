version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-pulsarr_server_1
      APP_PORT: 3003

  server:
    image: lakker/pulsarr:0.19.8@sha256:6083aea85ae13f275dfd628f1b6b3157060b9d5de357d00cad576afbee2e116b
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - baseUrl=http://mathieu-pulsarr_server_1
      - port=3003
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
    restart: on-failure
