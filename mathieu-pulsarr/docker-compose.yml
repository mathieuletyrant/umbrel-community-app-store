version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-pulsarr_server_1
      APP_PORT: 3003

  server:
    image: lakker/pulsarr:0.19.6@sha256:9f311d85b79fd54810f5d16cc979e0ff61e4d051fbcf4e75e83dfa3d995cfa50
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - baseUrl=http://mathieu-pulsarr_server_1
      - port=3003
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
    restart: on-failure
