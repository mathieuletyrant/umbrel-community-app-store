version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-pulsarr_server_1
      APP_PORT: 3003

  server:
    image: lakker/pulsarr:0.19.5@sha256:fb3a31fefbafac64bf64ed4d093455fbfca163cbac7675f0e01d5a51ca3a4c56
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - baseUrl=http://mathieu-pulsarr_server_1
      - port=3003
    volumes:
      - ${APP_DATA_DIR}/data/data:/app/data
    restart: on-failure
