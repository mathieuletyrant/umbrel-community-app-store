manifestVersion: 1
id: mathieu-lueur
storage:
  dataRoot: data
category: media
name: lueur
tagline: Your Philips Hue lights follow the films you play on Jellyfin
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lueur/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/lueur
version: "0.15.0"
port: 5878
description: >-
  lueur turns your Hue lights into an ambilight for Jellyfin, without a Hue
  Sync Box, a PC or the Hue Sync app. Each film is analyzed once (hardware
  decoding on Intel), then the lights of your entertainment area take the
  colors of their side of the screen, 50 times per second, while you watch on
  any Jellyfin client (Apple TV, TV, phone).


  The web UI finds and pairs your bridge, picks the entertainment area, lists
  your Jellyfin libraries and scans them. The Now page shows what is playing
  and each light's color live; brightness, saturation, smoothing and sync
  offset apply instantly, even during a film.


  🛠️ SETUP INSTRUCTIONS


  1. In the Hue app, create an entertainment area (Settings → Entertainment
  areas) around your TV.

  2. Open lueur → Settings, pick your bridge and press its link button.

  3. Jellyfin: URL `http://jellyfin_server_1:8096` and an admin API key
  (Jellyfin → Dashboard → API keys).

  4. Libraries: switch on Movies and Shows. Umbrel's Jellyfin and lueur both
  see your files under /downloads, so the suggested folders are right.

  5. Library → Analyze missing (an auto scan runs every 15 min too). By default a 2-hour film takes about 12 minutes; pick a speed and analysis hours in Settings → Analysis.


  Analysis uses the Intel GPU (Umbrel Home) when there is one, the CPU
  otherwise.
