manifestVersion: 1
id: mathieu-lueur
storage:
  dataRoot: data
category: media
name: lueur
tagline: Your Philips Hue lights follow the films you play on Jellyfin
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lueur/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/lueur
version: "0.9.0"
port: 5878
description: >-
  lueur turns your Hue lights into an ambilight for Jellyfin, without a Hue
  Sync Box, a PC or the Hue Sync app. Each film is analyzed once (hardware
  decoding on Intel), then the lights of your entertainment area take the
  colors of their side of the screen, 50 times per second, while you watch on
  any Jellyfin client (Apple TV, TV, phone).


  The web UI finds and pairs your bridge, picks the entertainment area, lists
  your Jellyfin libraries and scans them. The Now page shows what is playing
  and each light's color live; brightness, saturation, smoothing and sync
  offset apply instantly, even during a film.


  🛠️ SETUP INSTRUCTIONS


  1. In the Hue app, create an entertainment area (Settings → Entertainment
  areas) around your TV.

  2. Open lueur → Setup, pick your bridge and press its link button.

  3. Jellyfin: URL `http://jellyfin_server_1:8096` and an admin API key
  (Jellyfin → Dashboard → API keys).

  4. Libraries: switch on Movies and Shows. Umbrel's Jellyfin and lueur both
  see your files under /downloads, so the suggested folders are right.

  5. Library → Scan now. A 2-hour film takes about 3 minutes on an N100.


  Analysis uses the Intel GPU (Umbrel Home) when there is one, the CPU
  otherwise.
developer: Mathieu Le Tyrant
website: https://github.com/mathieuletyrant/lueur
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/lueur
repo: https://github.com/mathieuletyrant/lueur
support: https://github.com/mathieuletyrant/lueur/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lueur/gallery-1.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lueur/gallery-2.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lueur/gallery-3.jpg
releaseNotes: >-
  Smoother lights without delay: lueur now fades around each cut instead of
  after it, so a calm smoothing no longer makes the lights late. It learns
  how late each Jellyfin app reports its position and corrects the first
  seconds after a play or a seek; the re-sync thresholds are settings on the
  Now page. Analyses use about a third less CPU. On a phone, the navigation
  moves to a bottom tab bar.

  Full release notes can be found at
  https://github.com/mathieuletyrant/lueur/releases/tag/v0.9.0
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
  - GPU
