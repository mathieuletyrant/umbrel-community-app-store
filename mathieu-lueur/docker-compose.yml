version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lueur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/mathieuletyrant/lueur:0.13.0@sha256:db995c93a59bc7878d2bdb5c61f0c0173e92f78fbdfc0a3c7f4b03103165f77f
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/lueur:/data
      # Same path as Jellyfin's container, so Libraries map one to one.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
