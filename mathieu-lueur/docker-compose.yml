version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lueur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/mathieuletyrant/lueur:0.14.0@sha256:ac33e7874dcee8a89394b306178e880f33ac280d39a5dca68ef2da18dc49152d
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/lueur:/data
      # Same path as Jellyfin's container, so Libraries map one to one.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
