version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lueur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/mathieuletyrant/lueur:0.12.0@sha256:66bbb5779d685370c7577607c3b935baf0eea3f4d37427f5f191421856e2a376
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/lueur:/data
      # Same path as Jellyfin's container, so Libraries map one to one.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
