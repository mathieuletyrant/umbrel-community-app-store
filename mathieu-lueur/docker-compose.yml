version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lueur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/mathieuletyrant/lueur:0.20.0@sha256:bb44506d7137d1956488397684514257570e9d96e4332ea4d980499253a7ce31
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/lueur:/data
      # Same path as Jellyfin's container, so Libraries map one to one.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
