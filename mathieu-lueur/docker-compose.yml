version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lueur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/mathieuletyrant/lueur:0.7.0@sha256:2a7207a51262c410ad30a9da5fb8805e9711f4f997b052124f1c0f2a1de4e304
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/lueur:/data
      # Same path as Jellyfin's container, so Libraries map one to one.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
