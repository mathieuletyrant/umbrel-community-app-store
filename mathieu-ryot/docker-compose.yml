version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-ryot_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/_i/*"

  server:
    image: ghcr.io/ignisda/ryot:v10.5.5@sha256:046a79d34b43baceb119716b978554c41715c736ba118e5b77c3d8865e9fc011
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      DATABASE_URL: postgres://ryot:ryot@mathieu-ryot_db_1:5432/ryot
      SERVER_ADMIN_ACCESS_TOKEN: ${APP_SEED}
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:8010
      DISABLE_TELEMETRY: "true"
      USERS_ALLOW_REGISTRATION: "true"

  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ryot
      POSTGRES_USER: ryot
      POSTGRES_PASSWORD: ryot
      PGDATA: /data/pgdata
    healthcheck:
      test: "pg_isready -U ryot -h localhost -d ryot"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
