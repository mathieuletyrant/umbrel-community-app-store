version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-ryot_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/_i/*"

  server:
    image: ghcr.io/ignisda/ryot:v10.5.7@sha256:69dade0f20f66bfb0eccb4a35d778387c873e84fc8f3e39ddc5433501ceeda4f
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      DATABASE_URL: postgres://ryot:ryot@mathieu-ryot_db_1:5432/ryot
      SERVER_ADMIN_ACCESS_TOKEN: ${APP_SEED}
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:8010
      DISABLE_TELEMETRY: "true"
      USERS_ALLOW_REGISTRATION: "true"

  db:
    image: postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ryot
      POSTGRES_USER: ryot
      POSTGRES_PASSWORD: ryot
      PGDATA: /data/pgdata
    healthcheck:
      test: "pg_isready -U ryot -h localhost -d ryot"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
