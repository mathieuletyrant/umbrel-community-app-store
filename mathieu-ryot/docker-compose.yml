version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-ryot_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/_i/*"

  server:
    image: ghcr.io/ignisda/ryot:v10.6.0@sha256:201185827042ff40cb60da8d436790f138be34e786ce3a09ec7500cf511dd118
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      DATABASE_URL: postgres://ryot:ryot@mathieu-ryot_db_1:5432/ryot
      SERVER_ADMIN_ACCESS_TOKEN: ${APP_SEED}
      FRONTEND_URL: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:8010
      DISABLE_TELEMETRY: "true"
      USERS_ALLOW_REGISTRATION: "true"

  db:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ryot
      POSTGRES_USER: ryot
      POSTGRES_PASSWORD: ryot
      PGDATA: /data/pgdata
    healthcheck:
      test: "pg_isready -U ryot -h localhost -d ryot"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
