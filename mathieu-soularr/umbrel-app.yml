manifestVersion: 1
id: mathieu-soularr
storage:
  dataRoot: data
category: media
name: Soularr
tagline: Auto-download Lidarr's wanted music from Soulseek via slskd
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-soularr/icon.png
# renovate: datasource=docker depName=mrusse08/soularr
version: "1.2.3"
port: 8265
description: >-
  Soularr bridges Lidarr and slskd to automate music downloads from the Soulseek
  network. On a schedule it reads the albums marked "wanted" in Lidarr, has slskd
  search Soulseek for them, downloads the best match, and imports the result back
  into Lidarr automatically — ideal for niche or rare tracks that never appear on
  trackers.


  It ships a web UI (log viewer, config editor and failed-imports dashboard) so
  you can watch and tune it without touching the host.


  ⚠️ REQUIRES the slskd app (also in this store) and Lidarr, both running.


  🛠️ SETUP INSTRUCTIONS


  Open Soularr's config editor and fill in the two API keys: Lidarr's (Lidarr →
  Settings → General) and one you add in slskd (Options → web → authentication
  → api_keys). The addresses of Lidarr (lidarr_server_1) and slskd
  (mathieu-slskd_server_1) are already filled in.
  Addresses of the other apps, to copy:
  https://github.com/mathieuletyrant/umbrel-community-app-store#-connecting-apps


  Soularr processes your Lidarr wanted list every 5 minutes
  (change SCRIPT_INTERVAL in the app's compose to adjust). Downloads flow through
  /downloads/soulseek/complete — the same path slskd and Lidarr use — so imports
  line up with no path mapping.
developer: mrusse
website: https://github.com/mrusse/soularr
submitter: Mathieu Le Tyrant
submission: https://github.com/mrusse/soularr
repo: https://github.com/mrusse/soularr
support: https://github.com/mrusse/soularr/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-soularr/gallery-1.jpg
releaseNotes: >-
  Fixes several hangs while monitoring downloads and imports, a search timeout
  that was compared in the wrong unit, and handling of upper-case extensions.
  Adds optional settings to keep download folder names (rename_download_folders),
  skip users whose downloads failed (ignore_failed_users) and wait before
  re-searching a failed album (search_retry_wait_hours).

  Full release notes can be found at https://github.com/mrusse/soularr/releases/tag/v1.2.3

dependencies:
  - lidarr
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
