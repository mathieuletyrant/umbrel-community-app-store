version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-soularr_server_1
      APP_PORT: 8265

  server:
    image: mrusse08/soularr:v1.2.3@sha256:e448d49d0ca6091a35653ff9198ebb4a3acf42abfc2f2056490a9a0f0cffd210
    init: true
    user: "1000:1000"
    environment:
      - TZ=Etc/UTC
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
    volumes:
      - ${APP_DATA_DIR}/data/config:/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
