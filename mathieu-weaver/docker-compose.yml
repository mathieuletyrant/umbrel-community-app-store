version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-weaver_server_1
      APP_PORT: 9090

  server:
    image: ghcr.io/scryer-media/weaver:0.16.11@sha256:35dfa67f1e536d08c389723cde202ef86d2cc21c018cb0af620f7bfa8c06ea0d
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - WEAVER_BOOTSTRAP_LOGIN_USERNAME=admin
      - WEAVER_BOOTSTRAP_LOGIN_PASSWORD=${APP_PASSWORD}
      - WEAVER_INTERMEDIATE_DIR=/downloads/usenet/incomplete
      - WEAVER_COMPLETE_DIR=/downloads/usenet/complete
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
