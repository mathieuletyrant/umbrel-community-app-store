version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-weaver_server_1
      APP_PORT: 9090

  server:
    image: ghcr.io/scryer-media/weaver:0.14.1@sha256:45b49ab450f8999335fc43ecf8a592c55579c1d84b26b054944d38e17c1b5e14
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
      - WEAVER_BOOTSTRAP_LOGIN_USERNAME=admin
      - WEAVER_BOOTSTRAP_LOGIN_PASSWORD=weaver
      - WEAVER_INTERMEDIATE_DIR=/downloads/usenet/incomplete
      - WEAVER_COMPLETE_DIR=/downloads/usenet/complete
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
