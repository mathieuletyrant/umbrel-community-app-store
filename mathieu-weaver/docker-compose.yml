version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-weaver_server_1
      APP_PORT: 9090

  server:
    image: ghcr.io/scryer-media/weaver:0.14.7@sha256:6ed3fc234edb4f6b8e4c28f5fa3ada93507a0833f3f87ea73806adb7481f1fae
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - WEAVER_BOOTSTRAP_LOGIN_USERNAME=admin
      - WEAVER_BOOTSTRAP_LOGIN_PASSWORD=weaver-admin
      - WEAVER_INTERMEDIATE_DIR=/downloads/usenet/incomplete
      - WEAVER_COMPLETE_DIR=/downloads/usenet/complete
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
