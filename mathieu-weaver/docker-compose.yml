version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-weaver_server_1
      APP_PORT: 9090

  server:
    image: ghcr.io/scryer-media/weaver:0.14.5@sha256:0dfc1f50b62cbc04a4a02be8482fef602f645517ec3e7e6234b5cbf61c1ae75f
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - WEAVER_BOOTSTRAP_LOGIN_USERNAME=admin
      - WEAVER_BOOTSTRAP_LOGIN_PASSWORD=weaver-admin
      - WEAVER_INTERMEDIATE_DIR=/downloads/usenet/incomplete
      - WEAVER_COMPLETE_DIR=/downloads/usenet/complete
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
