manifestVersion: 1
id: mathieu-weaver
storage:
  dataRoot: data
category: media
name: Weaver
tagline: Usenet downloader with built-in repair and extraction
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-weaver/icon.png
# renovate: datasource=docker depName=ghcr.io/scryer-media/weaver
version: "0.16.0"
port: 9390
description: >-
  Weaver is a self-hosted Usenet downloader written in Rust. Downloading,
  verification, PAR2 repair and extraction run as one coordinated pipeline
  instead of separate post-processing steps, so articles are unpacked as they
  arrive rather than after the whole download lands.


  It handles RAR, 7z, ZIP and TAR natively — plus gzip, bzip2, xz, zstd and
  brotli — with no external unrar or par2 binaries, and streams RAR extraction
  straight out of the download.


  It pairs with Scryer (or any *arr app) as the Usenet download client, and
  drops completed files next to your other media so imports use hardlinks.


  🛠️ SETUP INSTRUCTIONS


  1. Open the app and sign in with the username and password shown in this
  app's settings in umbrelOS (Default credentials). The password is unique to
  your Umbrel; change it any time in Weaver's Settings → Security.

  2. Add your Usenet provider (server, port, SSL, connections) and your indexers
  in Settings.

  3. Downloads land in /downloads/usenet/complete on your shared media storage,
  so *arr apps can import them with hardlinks. Point them at
  `http://mathieu-weaver_server_1:9090`.
developer: Scryer Media
website: https://www.scryer.media/weaver/
submitter: Mathieu Le Tyrant
submission: https://github.com/scryer-media/weaver
repo: https://github.com/scryer-media/weaver
support: https://github.com/scryer-media/weaver/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-weaver/gallery-1.jpg
releaseNotes: >-
  History now records the full name of each file renamed after PAR2 repair or delivery, and the name it was originally posted with. Fixes to the speed test (server origin checks, connection pool accounting), updated archive libraries (zip 9, unrar 0.12, 7z/LZMA) with more precise RAR error handling, and a Windows build fix. No configuration changes.


  Full release notes can be found at https://github.com/scryer-media/weaver/releases/tag/weaver-v0.16.0
dependencies: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
permissions:
  - STORAGE_DOWNLOADS
