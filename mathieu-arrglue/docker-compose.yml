version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-arrglue_server_1
      APP_PORT: 8787
      PROXY_AUTH_WHITELIST: "/healthz"

  # Read-only view of the Docker API: arrglue discovers containers, networks
  # and events through it and can never create or change a container.
  socket_proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure

  server:
    image: ghcr.io/mathieuletyrant/arrglue:0.2.0@sha256:1fe2d081f0c8aad740e1ce0b240a20f51885d84e8f16b095adcceb3f9ec0a3de
    command: ["serve"]
    environment:
      DOCKER_HOST: tcp://mathieu-arrglue_socket_proxy_1:2375
      ARRGLUE_TOKEN: ${APP_PASSWORD}
      ARRGLUE_SECRETS: /data/secrets.yaml
    volumes:
      # the apps' config files and the media storage, read-only, at their host
      # paths so what Docker reports is readable as-is
      - ${UMBREL_ROOT}:${UMBREL_ROOT}:ro
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - socket_proxy
    restart: on-failure
