version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-quai_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:alpine@sha256:b50897d5c7b1aa08067c3d90c5e8b3e47ec4e3c91c91446f67820228f7b41e34
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          client_max_body_size 10m;
          resolver 127.0.0.11 valid=10s;
          set $$cloud http://mathieu-quai_cloud_1:8787;
          set $$home http://mathieu-quai_home_1:8788;

          location /api/ {
            proxy_pass $$cloud;
            proxy_set_header Host $$http_host;
            proxy_http_version 1.1;
            proxy_read_timeout 5m;
          }

          location / {
            proxy_pass $$home;
            proxy_set_header Host $$http_host;
            proxy_http_version 1.1;
            proxy_read_timeout 5m;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - cloud
      - home
    restart: on-failure

  cloud:
    image: ghcr.io/mathieuletyrant/quai:0.29.1@sha256:1210377eb3c72976758c7004c33d6d0f4b0741e851647bfb7884675940560573
    restart: on-failure
    environment:
      TZ: Etc/UTC
      QUAI_APNS_KEY_FILE: /keys/AuthKey.p8
    volumes:
      - ${APP_DATA_DIR}/data/quai:/keys:ro

  home:
    image: ghcr.io/mathieuletyrant/quai-home:0.29.1@sha256:8695d146008d17250587a3ca377aac31e464cf315c4c38860a7a480d94caf3b5
    restart: on-failure
    command:
      - sh
      - -c
      - |
        if [ "$$QUAI_CLOUD_URL" = "ws://mathieu-quai_cloud_1:8787/home" ]; then
          export QUAI_CLOUD_APP_URL="http://${DEVICE_DOMAIN_NAME}:3078"
        fi
        exec node --disable-warning=ExperimentalWarning main.js
    environment:
      TZ: Etc/UTC
      QUAI_CLOUD_URL: ws://mathieu-quai_cloud_1:8787/home
      QUAI_HOME_PASSWORD: ${APP_PASSWORD}
      QUAI_INTERNAL_URL: http://mathieu-quai_home_1:8788
      QUAI_RADARR_URL: http://radarr_server_1:7878
      QUAI_SONARR_URL: http://sonarr_server_1:8989
      QUAI_RADARR_WEB_URL: http://${DEVICE_DOMAIN_NAME}:7878
      QUAI_SONARR_WEB_URL: http://${DEVICE_DOMAIN_NAME}:8989
      QUAI_JELLYFIN_URL: http://jellyfin_server_1:8096
      QUAI_RECLAIMERR_URL: http://mathieu-reclaimerr_server_1:8000
      QUAI_SEERR_URL: http://jellyseerr_server_1:5055
      QUAI_CLEANUPARR_URL: http://mathieu-cleanuparr_server_1:11011
      QUAI_PROWLARR_URL: http://prowlarr_server_1:9696
      QUAI_QBITTORRENT_USERNAME: admin
    volumes:
      - ${APP_DATA_DIR}/data/home:/data
