version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-quai_server_1
      APP_PORT: 8787
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/mathieuletyrant/quai:0.1.0@sha256:409c16343acb8cab5584d848c806c3c1be4e79cb660abd31ae4fa302ef0293ca
    restart: on-failure
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/quai:/data
