version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-quai_cloud_1
      APP_PORT: 8787
      PROXY_AUTH_WHITELIST: "/api/*"

  cloud:
    image: ghcr.io/mathieuletyrant/quai:0.10.0@sha256:c1a47387f3e2b73d884512a84cbadc874f404c931c80a10fa532eeb7c55ee996
    restart: on-failure
    environment:
      TZ: Etc/UTC
      QUAI_APNS_KEY_FILE: /keys/AuthKey.p8
    volumes:
      - ${APP_DATA_DIR}/data/quai:/keys:ro

  home:
    image: ghcr.io/mathieuletyrant/quai-home:0.10.0@sha256:e2af4b5dee88100a77c50fe1ee808ec29784eeca59bcf620483cd3fb5f7b3d8b
    restart: on-failure
    environment:
      TZ: Etc/UTC
      QUAI_CLOUD_URL: ws://mathieu-quai_cloud_1:8787/home
      QUAI_INTERNAL_URL: http://mathieu-quai_home_1:8788
      QUAI_RADARR_URL: http://radarr_server_1:7878
      QUAI_SONARR_URL: http://sonarr_server_1:8989
      QUAI_JELLYFIN_URL: http://jellyfin_server_1:8096
      QUAI_RECLAIMERR_URL: http://mathieu-reclaimerr_server_1:8000
      QUAI_QBITTORRENT_USERNAME: admin
    volumes:
      - ${APP_DATA_DIR}/data/home:/data
