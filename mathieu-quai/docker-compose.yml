version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-quai_server_1
      APP_PORT: 8787
      PROXY_AUTH_WHITELIST: "/api/*"

  server:
    image: ghcr.io/mathieuletyrant/quai:0.3.3@sha256:74b425031048843f7419870462ae7a8d3f821cd5cb0f22753ec6b179503c9255
    restart: on-failure
    environment:
      TZ: Etc/UTC
      QUAI_INTERNAL_URL: http://mathieu-quai_server_1:8787
      QUAI_RADARR_URL: http://radarr_server_1:7878
      QUAI_SONARR_URL: http://sonarr_server_1:8989
      QUAI_JELLYFIN_URL: http://jellyfin_server_1:8096
      QUAI_QBITTORRENT_USERNAME: admin
    volumes:
      - ${APP_DATA_DIR}/data/quai:/data
