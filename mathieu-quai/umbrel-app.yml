manifestVersion: 1
id: mathieu-quai
storage:
  dataRoot: data
category: media
name: Quai
tagline: Your media stack, live on your iPhone
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-quai/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/quai
version: "2.2.0"
port: 3078
description: >-
  Quai follows every movie or series from the request to "ready to watch" and
  shows it on your iPhone's Lock Screen and in the Dynamic Island, with the
  app closed.


  It watches Radarr, Sonarr, qBittorrent and Jellyfin over your Umbrel's
  network and pushes Live Activities to the iPhones you pair: a download from
  search to import, what plays on Jellyfin (with Play/Pause). What goes wrong
  and may last is an alert, a plain notification when it starts and when it's
  over: a service that stops answering, the media disk running low, a problem
  Radarr, Sonarr or Prowlarr report. What the stack removed on its own can be
  one notification too, once gone: a title Reclaimerr deleted, a download
  Cleanuparr removed or cleaned after seeding, turned on in the iPhone app.
  And it searches Seerr: type or say a title in the app, or from a Lock
  Screen control, and request it in a tap.


  This app runs both halves of Quai: Quai Home, which holds your services'
  keys and your data, and Quai Cloud, which runs the flows and sends the
  pushes. Nothing leaves the Umbrel but the pushes to Apple. You can instead
  link Quai Home to the hosted Quai Cloud (cloud.quai.stream) in this app's
  settings: it needs no Apple key, and keeps nothing.


  🛠️ SETUP INSTRUCTIONS


  1. In this app's settings in umbrelOS, set Quai Cloud (QUAI_CLOUD_URL) to
  wss://cloud.quai.stream/home: the hosted Quai Cloud, free during the beta,
  with nothing more to set up. The default keeps the Quai Cloud in this app,
  which needs your own Apple push key and your own build of the iPhone app.

  2. Open Quai and sign in with the default password umbrelOS shows for this
  app.

  3. In Quai's Services page, paste the API key of each service you use:
  Radarr and Sonarr (Settings → General), Jellyfin (Dashboard → API Keys),
  and optionally Seerr, Reclaimerr, Cleanuparr and Prowlarr. Their Umbrel
  addresses are already filled in, and each key is checked as you save it.
  For qBittorrent, give the address of your qBittorrent app
  (http://qbittorrent_server_1:8080, or
  http://mathieu-qbittorrent-vpn_gluetun_1:8080 for qBittorrent VPN) and its
  password. The keys stay in this app's data and never leave the Umbrel. Keys
  already saved in this app's settings in umbrelOS keep working, and show as
  "Env" in that page.

  4. Optional: to open the console from outside, put this app behind your
  own proxy or tunnel and set QUAI_CONSOLE_PUBLIC_URL to that address in this
  app's settings. The iPhone app then opens the console at home or away.

  5. In Quai's iPhones page, show a QR code and scan it with the iPhone.

  Only with the Quai Cloud in this app: put your Apple push key in the Files
  app at Apps → mathieu-quai → data → quai, named AuthKey.p8, and enter its
  key id and your team id in this app's settings.


  Quai has its own password; the iPhone app talks to Quai's API directly.
  ⚠️ Early version: the iPhone app isn't on the App Store yet.
developer: Mathieu Le Tyrant
website: https://github.com/mathieuletyrant/quai-app
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/quai-app
repo: https://github.com/mathieuletyrant/quai-app
support: https://github.com/mathieuletyrant/quai-app/issues
gallery: []
releaseNotes: >-
  Quai 2.2. Each iPhone now keeps its own order of the Home tiles and can hide
  the ones it doesn't need. The Upcoming tile shows both what comes next and
  what leaves next.


  Full release notes can be found at https://github.com/mathieuletyrant/quai-app/blob/HEAD/CHANGELOG.md#220-2026-11-26
dependencies: []
path: ""
defaultUsername: ""
deterministicPassword: true
permissions: []
environment:
  - name: QUAI_CLOUD_URL
    services:
      - home
    default: ws://mathieu-quai_cloud_1:8787/home
    options:
      - ws://mathieu-quai_cloud_1:8787/home
      - wss://cloud.quai.stream/home
    note: Which Quai Cloud runs your flows and sends the pushes. The first is the one in this app, with your own Apple push key below. The second is the hosted Quai Cloud, which needs no Apple key; then pair your iPhones again.
  - name: QUAI_CONSOLE_PUBLIC_URL
    services:
      - home
    note: Optional. The console's address from outside, behind your own proxy or tunnel (https://quai.example.com). It goes in the pairing QR code, so the iPhone app's "Open the console" works away from home. Pair your iPhones again after setting it.
  - name: QUAI_RADARR_API_KEY
    services:
      - home
    note: Optional, rather set in Quai's Services page. Radarr's API key, from Settings → General; set here, it wins over that page.
  - name: QUAI_SONARR_API_KEY
    services:
      - home
    note: Optional, rather set in Quai's Services page. Sonarr's API key, from Settings → General; set here, it wins over that page.
  - name: QUAI_JELLYFIN_API_KEY
    services:
      - home
    note: Optional, rather set in Quai's Services page. A Jellyfin API key, from Dashboard → API Keys; set here, it wins over that page.
  - name: QUAI_SEERR_API_KEY
    services:
      - home
    note: Optional. Seerr's API key (Settings → General), to search and request titles from the iPhone, and approve or decline requests waiting for you. Quai sets up Seerr's webhook if none is set.
  - name: QUAI_CLEANUPARR_API_KEY
    services:
      - home
    note: Optional. Cleanuparr's API key (Settings → Account), to see downloads it is about to remove under To fix, keep one, and log its removals in the Journal.
  - name: QUAI_PROWLARR_API_KEY
    services:
      - home
    note: Optional. Prowlarr's API key (Settings → General), for alerts when it stops answering or reports a problem.
  - name: QUAI_RECLAIMERR_API_KEY
    services:
      - home
    note: Optional. A Reclaimerr API key (Settings → Integrations, scopes candidates:manage and system:read, and events:read to hear when it deleted a title), to list scheduled deletions under To fix and keep a title.
  - name: QUAI_QBITTORRENT_URL
    services:
      - home
    options:
      - http://qbittorrent_server_1:8080
      - http://mathieu-qbittorrent-vpn_gluetun_1:8080
    note: Pick your qBittorrent app, or qBittorrent VPN, to follow download progress.
  - name: QUAI_QBITTORRENT_PASSWORD
    services:
      - home
    note: Your qBittorrent Web UI password (for qBittorrent VPN, the default password shown in its settings in umbrelOS).
  - name: QUAI_RADARR_PUBLIC_URL
    services:
      - home
    note: Optional. Radarr's address from outside (https://radarr.example.com), for the app's "Open in Radarr" away from home. At home it opens Radarr on your Umbrel.
  - name: QUAI_SONARR_PUBLIC_URL
    services:
      - home
    note: Optional. Sonarr's address from outside, for "Open in Sonarr" away from home.
  - name: QUAI_APNS_KEY_ID
    services:
      - cloud
    note: Only with the Quai Cloud in this app, unused with cloud.quai.stream. The id of your Apple push key (the 10 characters in AuthKey_XXXXXXXXXX.p8). Put the file itself in data/quai as AuthKey.p8.
  - name: QUAI_APNS_TEAM_ID
    services:
      - cloud
    note: Only with the Quai Cloud in this app, unused with cloud.quai.stream. Your Apple developer team id (developer.apple.com → Membership).
  - name: QUAI_CLOUD_PUBLIC_URL
    services:
      - cloud
    note: Only with the Quai Cloud in this app, unused with cloud.quai.stream. Optional. That Quai Cloud's address from outside (behind Cloudflare Access, say), added to the pairing QR code so the iPhone app reaches it away from home. Not the console's address, which is QUAI_CONSOLE_PUBLIC_URL.
  - name: QUAI_CLOUD_PUBLIC_HEADERS
    services:
      - cloud
    note: 'Only with the Quai Cloud in this app, unused with cloud.quai.stream. Optional. Headers your proxy asks the iPhone app for, as "Name: value" pairs separated by ";" (a Cloudflare Access service token is "CF-Access-Client-Id: …; CF-Access-Client-Secret: …"). They go in the pairing QR code.'
