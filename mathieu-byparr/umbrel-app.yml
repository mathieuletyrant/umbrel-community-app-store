releaseNotes: >-
  Byparr's browser now keeps its temporary files in memory, as its developer recommends, instead of writing them to your Umbrel's disk on every request.


  The app moves from port 8191 to 8192, because FlareSolverr from the Umbrel App Store already uses 8191 and the two apps could not be installed together. Update your bookmark if you open it by address.


  Cloudflare challenges are solved again: Byparr now matches a real browser's TLS fingerprint and detects localized interstitials, not just English ones. Requests no longer fail when the page blocks script evaluation (such as Firefox's JSON viewer). A new optional BROWSER_LOCALE setting lets you force the browser language.

  Full release notes can be found at https://github.com/ThePhaseless/Byparr/releases/tag/v3.0.4
