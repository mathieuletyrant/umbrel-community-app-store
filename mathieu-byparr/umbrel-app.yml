releaseNotes: >-
  Cloudflare-protected plain-http pages now load, and the cookies Byparr returns are limited to the requested page. Pages are read after the browser has gone idle rather than before, and Byparr handles the browser's own errors better. The browser timezone is resolved once instead of on every request, and the log level now reaches the web server. Dependencies are updated, including Playwright and FastAPI.


  Full release notes can be found at https://github.com/ThePhaseless/Byparr/releases/tag/v3.1.1

