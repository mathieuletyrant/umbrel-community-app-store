version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-byparr_server_1
      APP_PORT: 8191

  server:
    image: ghcr.io/thephaseless/byparr:3.1.1@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
    init: true
    shm_size: 2gb
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    environment:
      - TZ=Etc/UTC
      - PORT=8191
    restart: on-failure
