version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-byparr_server_1
      APP_PORT: 8191

  server:
    image: ghcr.io/thephaseless/byparr:3.0.4@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
    init: true
    shm_size: 2gb
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    environment:
      - TZ=Etc/UTC
      - PORT=8191
    restart: on-failure
