version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-chaptarr_server_1
      APP_PORT: 8789

  server:
    image: robertlordhood/chaptarr:0.9.928@sha256:75701b9c6bfa68e2fd5db576ff154267c6d7794843cb5c42383640ab6af53077
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    restart: on-failure
