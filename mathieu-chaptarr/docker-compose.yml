version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-chaptarr_server_1
      APP_PORT: 8789

  server:
    image: robertlordhood/chaptarr:0.9.999@sha256:4a38f9600281ec0d27aaabf6d90086edc2c67d44168fa41d0426c06a27f53da1
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
