verified: 0.11.0 on umbrelOS 2.0.0 (2026-10-18)
logs:
  server: '"step":"start"'
steps:
  - http:
      path: /api/spotarr.v1.SpotarrService/GetStatus
      method: POST
      anonymous: true
      headers: {content-type: application/json}
      body: {}
      status: 401
  - http:
      path: /api/spotarr.v1.SpotarrService/GetStatus
      method: POST
      anonymous: true
      headers: {content-type: application/json, authorization: "Bearer ${env.server.API_TOKEN}"}
      body: {}
      status: 200
      contains: '"version":"0.11.0"'
  - http:
      path: /mcp
      method: POST
      anonymous: true
      headers: {content-type: application/json}
      body: {}
      status: 401
      contains: missing or invalid MCP token
  - goto: /
  - fill: {label: API token, value: "${env.server.API_TOKEN}"}
  - click: {role: button, name: Sign in}
  - see: Every share, what was suggested and what was added.
  - shot: history
  - click: {role: link, name: Settings}
  - see: Where Spotarr checks the library and sends requests.
  - click: {role: link, name: Identification}
  - see: The LLM names the works
  - click: {role: link, name: Access}
  - see: MCP URL
  - shot: settings
