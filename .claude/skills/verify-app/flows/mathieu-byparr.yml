verified: 3.0.4-patch.2 on umbrelOS 2.0.0 (2026-10-09)
# The healthcheck solves a challenge on a real website with the bundled browser, which can't
# trust the sandbox's TLS-intercepting proxy, so health never leaves "starting" here.
ignoreHealth: true
setup:
  - docker exec mathieu-byparr_server_1 sh -c 'grep -q " /tmp tmpfs " /proc/mounts'
logs:
  server: Uvicorn running on
steps:
  - http:
      path: /v1
      method: POST
      headers: {content-type: application/json}
      body: {cmd: request.get, url: "http://127.0.0.1:8191/docs", maxTimeout: 60000}
      status: 200
      contains: '"status":\s*"ok"'
  - shot: solve
