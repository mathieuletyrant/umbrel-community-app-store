verified: 1.4.0-patch.1 on umbrelOS 2.0.0 (2026-10-09)
requires: [plex, radarr, sonarr]
timeout: 420
vars:
  RADARR_API_KEY: docker exec radarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
  SONARR_API_KEY: docker exec sonarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
# No Plex account or TMDb token offline: a placeholder Plex token gets Labelarr past its Plex
# check, so the proof shows the settings arrived and it now only waits for TMDb.
settings:
  PLEX_TOKEN: verify-placeholder
  USE_RADARR: "true"
  RADARR_API_KEY: ${RADARR_API_KEY}
  USE_SONARR: "true"
  SONARR_API_KEY: ${SONARR_API_KEY}
setup:
  - docker exec mathieu-labelarr_server_1 sh -c '[ "$PLEX_TOKEN" = verify-placeholder ] && [ "$USE_RADARR" = true ] && [ -n "$RADARR_API_KEY" ] && [ -n "$SONARR_API_KEY" ]'
logs:
  server: TMDB_READ_ACCESS_TOKEN environment variable is required
steps:
  - goto: /
  - see: {text: "Reachable (Plex", reload: true}
  - see: Add your TMDb read access token
  - see: {css: "#wiring tr:has-text('TMDb')", text: Token missing}
  - shot: status
