vars:
  SLSKD_API_KEY: docker exec mathieu-slskd_server_1 printenv SLSKD_API_KEY
logs:
  server: Listening for HTTP requests
steps:
  # The primary API key generated by exports.sh (the one Soularr uses) is accepted.
  - http: {path: /api/v0/application, headers: {X-API-Key: "${SLSKD_API_KEY}"}, status: 200}
  - goto: /
  # Stops at the login page: connecting to Soulseek needs a real account.
  - shot: login
