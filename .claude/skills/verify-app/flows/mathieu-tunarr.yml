verified: 2026.10.0-patch.1 on umbrelOS 2.0.0 (2026-10-08)
fixtures: [movie]
steps:
  - goto: /web/welcome
  - see: Welcome to Tunarr!
  - click: {role: button, name: ADD}
  - click: {role: menuitem, name: Local}
  - fill: {label: Name, exact: true, value: Films}
  - fill: {label: Path, exact: true, value: /downloads/movies}
  - click: {css: "[role=dialog] button >> nth=0"}
  - see: {css: "[role=dialog] li:has-text('/downloads/movies')"}
  - click: {css: "[role=dialog] button[type=submit]"}
  - see: 1 source connected.
  - click: {role: button, name: NEXT}
  - see: FFMPEG is installed.
  - click: {role: button, name: NEXT}
  - see: You're All Set!
  - click: {role: button, name: FINISH}
  - see: New Channel
  - fill: {label: Channel Name, exact: true, value: Umbrel TV}
  - click: {role: button, name: SAVE}
  - see: No programming added yet
  - click: {role: button, name: ADD MEDIA}
  # The library scan of the new source finishes a few seconds after it is added.
  - see: {text: Test Pattern, exact: true, reload: true}
  - click: Test Pattern
  - click: {role: button, name: ADD SELECTED MEDIA}
  - see: Test Pattern - (02 mins)
  - click: {role: button, name: SAVE}
  - see: 1 program
  - http: {path: /lineup.json, status: 200, contains: Umbrel TV}
  - http: {path: /api/xmltv.xml, status: 200, contains: Test Pattern}
  - goto: /web/guide
  - see: {text: Test Pattern, exact: true}
  - shot: guide
