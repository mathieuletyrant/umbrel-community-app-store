verified: 1.41.1-patch.1 on umbrelOS 2.0.0 (2026-10-09)
requires: [radarr]
vars:
  RADARR_API_KEY: docker exec radarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
steps:
  - goto: /
  - see: Set up arr-mcp
  - fill: {label: Password, exact: true, value: Verify-ArrMcp-1}
  - fill: {label: Confirm password, value: Verify-ArrMcp-1}
  - click: {role: button, name: Claim this instance}
  - click: {role: link, name: Configuration}
  - click: {role: button, name: Add a service}
  - select: {css: "[id='add.type']", value: radarr}
  - fill: {css: "[id='add.url']", value: "http://radarr_server_1:7878"}
  - fill: {css: "[id='add.api_key']", value: "${RADARR_API_KEY}"}
  - click: {role: button, name: Add, exact: true}
  - see: {text: radarr_server_1:7878, reload: true}
  - shot: services
