verified: 0.2.1 on umbrelOS 2.0.0 (2026-10-09)
requires: [radarr, sonarr, prowlarr, bazarr, transmission, mathieu-healarr]
vars:
  RADARR_API_KEY: docker exec radarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
  SONARR_API_KEY: docker exec sonarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
  PROWLARR_API_KEY: docker exec prowlarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
  BAZARR_API_KEY: >-
    docker exec bazarr_server_1 awk '/^auth:/ {a=1; next} /^[^ #]/ {a=0} a && /^  apikey:/ {gsub(/["\047]/, "", $2); print $2; exit}' /config/config/config.yaml
# What the user fills in Vitals' settings. Healarr gets its address but no key.
settings:
  RADARR_URL: http://radarr_server_1:7878
  RADARR_API_KEY: ${RADARR_API_KEY}
  SONARR_URL: http://sonarr_server_1:8989
  SONARR_API_KEY: ${SONARR_API_KEY}
  PROWLARR_URL: http://prowlarr_server_1:9696
  PROWLARR_API_KEY: ${PROWLARR_API_KEY}
  BAZARR_URL: http://bazarr_server_1:6767
  BAZARR_API_KEY: ${BAZARR_API_KEY}
  TRANSMISSION_URL: http://transmission_server_1:9091/transmission/rpc
  HEALARR_URL: http://mathieu-healarr_server_1:3090
logs:
  server: "apps: radarr, sonarr, prowlarr, bazarr, transmission"
steps:
  - http: {path: /v1/summary, anonymous: true, status: 401}
  - http:
      path: /v1/summary
      anonymous: true
      headers: {authorization: "Bearer ${env.server.VITALS_TOKEN}"}
      status: 200
      contains: '"healthy":true,"apps".*"prowlarr":\{"name":"Prowlarr","status":"ok".*"bazarr":\{"name":"Bazarr","status":"ok"'
  - widget: {id: media, contains: '"title":"Movies","text":"0"'}
  - see: Episodes
  - shot: media-widget
  - goto: /
  - see: All healthy
  - see: "Paste Healarr's API key in Vitals' settings"
  - see: "Set Maintainerr's address in Vitals' settings"
  - shot: status-page
