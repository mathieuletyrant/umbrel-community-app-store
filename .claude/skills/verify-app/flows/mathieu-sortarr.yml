verified: 1.0.8-patch.1 on umbrelOS 2.0.1 (2026-11-06)
requires: [prowlarr]
# Browsed by IP, not localhost: browsers accept Secure cookies over plain HTTP on localhost only,
# which hid a login loop that every real umbrel.local / IP install hit.
vars:
  HOST_IP: docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'
  PROWLARR_API_KEY: docker exec prowlarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
steps:
  - goto: http://${HOST_IP}:9697/
  - see: Bienvenue sur Sortarr
  - fill: {css: "#username", value: verify}
  - fill: {css: "#password", value: Verify-Sortarr-1}
  - fill: {css: "#confirmPassword", value: Verify-Sortarr-1}
  - click: {role: button, name: Créer le compte}
  - click: {text: Passer pour l'instant}
  - see: Configuration requise
  - click: Aller aux paramètres
  - see: Clé API Prowlarr
  # the settings page ignores edits made in its first 400 ms, then auto-saves them
  - wait: 1000
  - fill: {label: "🌐 URL de Prowlarr", value: "http://prowlarr_server_1:9696"}
  - fill: {label: "🔑 Clé API Prowlarr", value: "${PROWLARR_API_KEY}"}
  - see: Enregistré automatiquement
  - click: {role: button, name: "🔌 Tester la connexion Prowlarr"}
  - see: Connexion réussie à Prowlarr
  - goto: http://${HOST_IP}:9697/
  - see: Gestion des indexeurs
  - see: Aucun indexeur trouvé sur Prowlarr
  - shot: indexers
