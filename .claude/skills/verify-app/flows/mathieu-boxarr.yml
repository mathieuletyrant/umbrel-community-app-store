verified: 2.1.0-patch.2 on umbrelOS 2.0.0 (2026-10-06)
requires: [transmission, radarr]
logs:
  autoconfig: connected to Radarr
steps:
  # Boxarr skips its setup page: the autoconfig service wrote Radarr into local.yaml.
  - http: {path: /api/config, status: 200, contains: 'radarr_server_1:7878.*"radarr_configured":\s*true'}
  - shot: config
