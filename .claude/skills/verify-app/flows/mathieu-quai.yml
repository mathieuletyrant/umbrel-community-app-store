verified: 2.4.0 on umbrelOS 2.0.1 (2026-11-27)
logs:
  cloud: "connected"
  home: "linked as home"
steps:
  - http: {path: /api/health, anonymous: true, status: 200, contains: '"status":"ok"'}
  - http: {path: /api/activities, anonymous: true, status: 503, contains: HomeOffline}
  - http: {path: /console-api/devices, anonymous: true, status: 401}
  - goto: /
  - fill: {css: "input[type=password]", value: "${env.home.QUAI_HOME_PASSWORD}"}
  - click: {role: button, name: Sign in}
  - see: Set up Quai
  - see: Nothing is pushed
  - shot: settings
  - goto: /#services
  - see: Not set
  - click: {role: button, name: Set up}
  - see: Save and check
  - shot: services
  - click: {role: link, name: Flows}
  - click: {role: button, name: Choose a flow}
  - see: Jellyfin playback
  - shot: flows
  - goto: /#alerts
  - see: Problems Radarr, Sonarr and Prowlarr report
  - shot: alerts
  - goto: /#iphones
  - see: No iPhone paired yet
  - click: {role: button, name: Pair an iPhone}
  - see: Expires in
  - shot: pairing
