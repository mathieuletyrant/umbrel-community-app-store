verified: 26.11.19 on umbrelOS 2.0.1 (2026-11-25)
# Browsed by IP over plain HTTP like a real install: Django's CSRF check is what a wrong origin breaks.
vars:
  HOST_IP: echo umbrel-host.test
timeout: 600
steps:
  - goto: http://${HOST_IP}:8743/accounts/signup/
  - fill: {css: "input[name=username]", value: verify}
  - fill: {css: "input[name=password1]", value: Verify-Floppy-1}
  - fill: {css: "input[name=password2]", value: Verify-Floppy-1}
  - click: {role: button, name: Create Account, exact: true}
  - see: What do you want to track?
  - click: {role: link, name: Save & finish later}
  - see: Calendar
  - shot: home
