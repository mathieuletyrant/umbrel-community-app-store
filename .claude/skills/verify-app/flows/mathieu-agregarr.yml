verified: 2.11.0-patch.1 on umbrelOS 2.0.0 (2026-10-09)
setup:
  - docker exec mathieu-agregarr_server_1 sh -c 'for p in /proc/[0-9]*; do [ "$(cat $p/comm 2>/dev/null)" = node ] && grep -Eq "^Uid:[[:space:]]+1000[[:space:]]" $p/status && exit 0; done; exit 1'
steps:
  - http: {path: /api/v1/status, status: 200, contains: '"version":"2\.11\.0"'}
  - goto: /
  - url: /setup
  # Stops at the Plex sign-in: the next setup steps need a Plex account (plex.tv OAuth).
  - see: Welcome to Agregarr
  - see: {role: button, name: Sign In}
  - shot: setup
