verified: 0.14.7-patch.1 on umbrelOS 2.0.0 (2026-10-09)
steps:
  - goto: /
  - fill: {label: Username, value: admin}
  - fill: {label: Password, value: "${env.server.WEAVER_BOOTSTRAP_LOGIN_PASSWORD}"}
  - click: {role: button, name: Sign in}
  - see: Connect your Usenet provider
  # Stops before the provider: it needs a real Usenet account. The folders step shows the
  # /downloads paths set by WEAVER_COMPLETE_DIR / WEAVER_INTERMEDIATE_DIR.
  - click: {role: button, name: Skip for now}
  - see: /downloads/usenet/complete
  - shot: folders
