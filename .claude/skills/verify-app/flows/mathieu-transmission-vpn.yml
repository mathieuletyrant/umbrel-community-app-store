verified: 4.1.3 on umbrelOS 2.0.0 (2026-10-23)
egress: true
# Gluetun is unhealthy until the key is saved; the logs below prove the tunnel instead.
ignoreHealth: true
vars:
  # A real ProtonVPN WireGuard key (NAT-PMP on): the cloud environment's secret, or a local file.
  WG_KEY: printenv PROTON_WG_KEY || cat ~/.umbrel-verify/proton-wg-key
settings:
  VPN_SERVICE_PROVIDER: protonvpn
  VPN_PORT_FORWARDING: "on"
  PORT_FORWARD_ONLY: "on"
  WIREGUARD_PRIVATE_KEY: ${WG_KEY}
logs:
  gluetun: port forwarded is \d+
  port-sync: Transmission peer port set to \d+
steps:
  - goto: /transmission/web/
  - see: 0 Transfers
  - shot: transmission
# No outbound UDP (Claude cloud sandbox): no WireGuard. Gluetun waits for its settings, and a
# stand-in public IP file lets Transmission start in Gluetun's (unfirewalled) network, so the
# image and the web UI are proven; the tunnel and port forwarding aren't.
noTunnel:
  vars: null
  settings: null
  setup:
    - docker exec mathieu-transmission-vpn_gluetun_1 sh -c 'echo 203.0.113.1 > /gluetun/ip'
  logs:
    gluetun: Waiting for the VPN provider
