requires: [sonarr, radarr]
logs:
  autoconfig: added Sonarr and Radarr
steps:
  # Sublarr's own health check calls Sonarr and Radarr with the keys the autoconfig service set.
  - http: {path: /api/v1/health/detailed, status: 200, contains: '"arr_connectivity":\s*\{\s*"healthy":\s*true,\s*"radarr":\s*\[\s*\{\s*"healthy":\s*true[\s\S]*?"sonarr":\s*\[\s*\{\s*"healthy":\s*true'}
  - shot: health
