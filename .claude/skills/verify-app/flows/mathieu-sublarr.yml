verified: 1.20.0 on umbrelOS 2.0.1 (2026-11-04)
vars:
  SETUP_CODE: docker logs mathieu-sublarr_server_1 2>&1 | sed -n 's/.*one-time setup code: \([A-Za-z0-9_-]*\).*/\1/p' | tail -1
steps:
  - goto: /
  - see: Set a password to protect the UI
  - wait: 5000
  - fill: {placeholder: "Enter a password…", value: Verify-Sublarr-1}
  - fill: {placeholder: "Repeat password…", value: Verify-Sublarr-1}
  - click: {role: button, name: "Set Password & Continue"}
  - fill: {css: "#setup-token", value: "${SETUP_CODE}"}
  - click: {role: button, name: "Set Password & Continue"}
  - wait: 3000
  - goto: /login
  - fill: {placeholder: Password, value: Verify-Sublarr-1}
  - click: {role: button, name: Log In}
  - click: {css: "[data-testid=wizard-next]"}
  - click: {css: "[data-testid=wizard-pick]"}
  - click: {css: "[data-testid=wizard-done-close]"}
  - click: {css: "[data-testid=usage-stats-decline]"}
  - wait: 1500
  - see: Live Activity Feed
  - shot: dashboard
