verified: 0.1.0-patch.6 on umbrelOS 2.0.0 (2026-10-09)
requires: [freshrss]
headless: true
setup:
  - docker exec mathieu-freshrss-mcp_server_1 sh -c 'echo "$FRESHRSS_BASE_URL" | grep -Eq "^http://[A-Za-z0-9.-]+:3432$"'
  # The sandbox kernel has no IPv6: FreshRSS's nginx can't bind [::]:80 and never serves HTTP.
  - docker exec freshrss_server_1 sh -c "sed -i '/listen \[::\]/d' /config/nginx/site-confs/default.conf && s6-svc -r /run/service/svc-nginx"
  # One unread article for the widget, offline: a feed served by FreshRSS itself on loopback,
  # which FreshRSS only fetches once loopback is in its internal_host_allowlist.
  - |
    docker exec -i -u 1000 -e DATA_PATH=/config/www/freshrss/data freshrss_server_1 sh -s <<'SH'
    set -e
    cd /app/www
    printf '%s' '<?xml version="1.0"?><rss version="2.0"><channel><title>Verify feed</title><link>http://127.0.0.1/</link><description>Fixture</description><item><title>Widget test article</title><link>http://127.0.0.1/verify-article</link><guid>verify-article</guid></item></channel></rss>' > p/verify-feed.xml
    php -r '$f = getenv("DATA_PATH") . "/config.php"; $c = include $f; $c["internal_host_allowlist"] = ["127.0.0.1/32"]; file_put_contents($f, "<?php\nreturn " . var_export($c, true) . ";\n");'
    printf '%s' '<?xml version="1.0"?><opml version="2.0"><body><outline text="Verify feed" type="rss" xmlUrl="http://127.0.0.1/verify-feed.xml"/></body></opml>' > /tmp/verify.opml
    php cli/import-for-user.php --user admin --filename /tmp/verify.opml
    php cli/actualize-user.php --user admin || true
    SH
# The init service needs a FreshRSS account; create one before installing.
prepare:
  - docker exec -u 1000 -e DATA_PATH=/config/www/freshrss/data freshrss_server_1 sh -c 'cd /app/www && (php cli/list-users.php | grep -q . || (php cli/do-install.php --default-user admin --auth-type form --environment production --base-url http://localhost --db-type sqlite && php cli/create-user.php --user admin --password Verify-FreshRSS-1))'
logs:
  init: API password (generated|already set)
steps:
  - http:
      path: /mcp
      method: POST
      anonymous: true
      headers: {content-type: application/json, accept: "application/json, text/event-stream"}
      body: {jsonrpc: "2.0", id: 1, method: tools/list}
      status: 401
  - http:
      path: /mcp
      method: POST
      anonymous: true
      headers: {content-type: application/json, accept: "application/json, text/event-stream", authorization: "Bearer ${env.server.API_KEY}"}
      body: {jsonrpc: "2.0", id: 1, method: initialize, params: {protocolVersion: "2025-06-18", capabilities: {}, clientInfo: {name: verify, version: "1"}}}
      status: 200
  - http:
      path: /mcp
      method: POST
      anonymous: true
      headers: {content-type: application/json, accept: "application/json, text/event-stream", authorization: "Bearer ${env.server.API_KEY}"}
      body: {jsonrpc: "2.0", id: 2, method: tools/list}
      status: 200
      contains: '"tools"'
  - shot: tools
  - widget: unread
  - see: Widget test article
  - shot: unread-widget
  # Its fallback has the same titles with dashes: the JSON check proves real counts.
  - widget: {id: overview, contains: '"title":"Unread","text":"[1-9]'}
  - see: Starred
  - shot: overview-widget
