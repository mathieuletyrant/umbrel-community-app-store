verified: 1.3.17-patch.3 on umbrelOS 2.0.0 (2026-10-09)
requires: [radarr]
vars:
  RADARR_API_KEY: docker exec radarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
logs:
  server: started successfully
steps:
  # The dashboard crashes (ErrorBoundary) when the GitHub release check fails, which it
  # always does in the sandbox (api.github.com is blocked outside this repo).
  - mock:
      path: /api/updates/check
      body: {current_version: "1.3.17", latest_version: "1.3.17", update_available: false}
  - goto: /
  - click: Fresh Start
  - fill: {label: Password, exact: true, value: verify-healarr}
  - fill: {label: Confirm Password, value: verify-healarr}
  - click: {role: button, name: Continue}
  - select: {css: "#arr-type", value: radarr}
  - fill: {css: "#arr-url", value: "http://radarr_server_1:7878"}
  - fill: {css: "#arr-api-key", value: "${RADARR_API_KEY}"}
  - click: {role: button, name: Test Connection}
  - click: {role: button, name: Add Instance}
  - fill: {css: "#path-local", value: /downloads/movies}
  - select: {css: "#path-remote", value: /downloads/movies}
  - click: {role: button, name: Add Path}
  - click: {role: button, name: "Skip & Continue"}
  - see: Setup Complete!
  - click: Go to Dashboard
  - see: System Overview
  - see: 1/1 *arr
  - see: {text: movies, exact: true}
  - shot: dashboard
