verified: 1.4.0-patch.1 on umbrelOS 2.0.0 (2026-10-09)
requires: [radarr]
vars:
  RADARR_API_KEY: docker exec radarr_server_1 sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml
setup:
  - docker exec mathieu-lingarr_server_1 sh -c '[ "$(id -u)" = 1000 ] && ls /app/config/*.db >/dev/null && [ -z "$(find /app/config ! -user 1000)" ]'
steps:
  - goto: /
  - see: Welcome to Lingarr
  - click: {role: button, name: Continue}
  - see: Help Improve Lingarr
  - click: {role: button, name: Skip}
  - see: Setup complete!
  - click: {role: button, name: Go to Dashboard}
  - wait: 3000
  - shot: dashboard
  - goto: /settings/integration
  - see: "Radarr Settings:"
  # Its inputs have no label tied to them: the first two are Radarr's address and API key.
  - fill: {css: "input >> nth=0", value: "http://radarr_server_1:7878"}
  - fill: {css: "input >> nth=1", value: "${RADARR_API_KEY}"}
  - wait: 2000
  # Inputs can't be asserted with `see`: read the saved value back.
  - http:
      path: /api/setting/multiple/get
      method: POST
      headers: {Content-Type: application/json}
      body: [radarr_url]
      status: 200
      contains: '"radarr_url":"http://radarr_server_1:7878"'
  - goto: /settings/integration
  - see: "Radarr Settings:"
  - shot: integrations
