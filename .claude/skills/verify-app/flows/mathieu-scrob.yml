verified: 2.38.0 on umbrelOS 2.0.1 (2026-11-08)
# Browsed by IP over plain HTTP like a real install: since 2.35.0 registration
# signs in directly (the Secure cookie is only set over HTTPS).
vars:
  HOST_IP: echo umbrel-host.test
logs:
  db: database system is ready to accept connections
steps:
  - goto: http://${HOST_IP}:7330/register
  - fill: {label: Email, exact: true, value: verify@example.com}
  - fill: {label: Username, exact: true, value: verify}
  - fill: {label: Password, exact: true, value: Verify-Scrob-1}
  - fill: {label: Confirm Password, exact: true, value: Verify-Scrob-1}
  - click: {role: button, name: Create Account}
  - see: Finish setting up your account
  - shot: home
