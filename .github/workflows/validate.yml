name: Validate apps

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - run: pip install pyyaml

      - name: Validate app definitions
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 .github/scripts/validate_apps.py
