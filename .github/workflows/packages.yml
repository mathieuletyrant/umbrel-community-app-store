name: Packages

on:
  push:
    paths: ["packages/**", ".github/workflows/packages.yml"]
  pull_request:
    paths: ["packages/**", ".github/workflows/packages.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: packages/package.json

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [widgets, vitals]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the image, skip a version that is already published
        id: version
        run: |
          manifest="packages/${{ matrix.package }}/package.json"
          IMAGE=$(jq -r .image "$manifest")
          version=$(jq -r .version "$manifest")
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$version is already published. Bump the version in $manifest to publish a new image." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.version.outputs.published != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.version.outputs.published != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages
          build-args: PACKAGE=${{ matrix.package }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - if: steps.build.outputs.digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`$IMAGE:$VERSION@$DIGEST\`" | tee -a "$GITHUB_STEP_SUMMARY"
