version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sortarr_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$http_x_forwarded_proto $$sortarr_proto {
          ~^(?<first>https?)  $$first;
          default             http;
        }
        server {
          listen 80;
          client_max_body_size 10m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-sortarr_server_1:3000;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header X-Forwarded-Proto $$sortarr_proto;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/lroffic/sortarr:1.0.8@sha256:ac1f17d2fbb9650506b3801ca29e0758f77e043c3211e2a9ca9f1721294fc8a7
    restart: on-failure
    environment:
      TZ: Etc/UTC
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    volumes:
      - ${APP_DATA_DIR}/data/sortarr:/app/data
