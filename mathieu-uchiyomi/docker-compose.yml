version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-uchiyomi_server_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/opds,/opds/*,/img,/img/*,/api,/api/*,/healthz,/auth/me"
      PROXY_AUTH_BLACKLIST: "/api/setup,/api/setup/*"

  server:
    image: ghcr.io/angelosha/uchiyomi:v0.109.0@sha256:06ae606993cec99664d8ea86fe0be9b18fb3b65c88c8090018f533aff54550a6
    restart: on-failure
    stop_grace_period: 40s
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      NODE_ENV: production
      PORT: "3000"
      LIBRARY_BACKEND: owned
      PUBLIC_ORIGIN: http://${DEVICE_DOMAIN_NAME}:8110
      JWT_SECRET: ${APP_SEED}
      FLARESOLVERR_URL: http://mathieu-uchiyomi_flaresolverr_1:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      BACKUP_KEEP: "14"
      UCHIYOMI_PLATFORM: umbrel
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/manga:/library
      - ${APP_DATA_DIR}/data/db:/data
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/library-dl
      - ${APP_DATA_DIR}/data/cache:/cache
      - ${APP_DATA_DIR}/data/backups:/backups

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: on-failure
    shm_size: 1gb
    mem_limit: 2g
    environment:
      TZ: Etc/UTC
      LOG_LEVEL: warning
