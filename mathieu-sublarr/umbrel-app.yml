releaseNotes: >-
  Adds bundled anime glossary suggestions and per-language glossary entries, and long lists now scroll in their own box. Translations that merely echo the source text are rejected and retried, only approved glossary entries reach DeepL and Google, and series glossaries are no longer cut at 30 entries.


  Also fixes second-cour episode numbering, extraction timeouts on large remuxes, wrong-language downloads, signs-only tracks saved as full subtitles, and the setup token being hidden in the container log.


  Full release notes can be found at https://github.com/Abrechen2/Sublarr/releases/tag/v1.21.0
dependencies: []
