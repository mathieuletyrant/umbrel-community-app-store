version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sublarr_server_1
      APP_PORT: 5765

  server:
    image: ghcr.io/abrechen2/sublarr:1.21.2@sha256:91d10592bb8791857a701f24162e1bdc461a09524101a417e2b891e3f421505b
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBLARR_CORS_ORIGINS=*
      - SUBLARR_MEDIA_PATH=/downloads
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
