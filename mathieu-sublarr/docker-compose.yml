version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sublarr_server_1
      APP_PORT: 5765

  server:
    image: ghcr.io/abrechen2/sublarr:1.18.1@sha256:cc8f4cfcf84ce02cc299a74e7c7fd77a8ed9d8bc6cb8da8cb7cb9e83e2961bd9
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBLARR_CORS_ORIGINS=*
      - SUBLARR_MEDIA_PATH=/downloads
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
