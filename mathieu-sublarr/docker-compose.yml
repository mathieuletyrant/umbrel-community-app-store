version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sublarr_server_1
      APP_PORT: 5765

  server:
    image: ghcr.io/abrechen2/sublarr:1.15.1@sha256:0569b2effa0e6f092f05eef095a63986bdd15f6bfef9aa9aa8d41b0617b2ce6c
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      # Allow the websocket/CORS from any origin — Umbrel apps are reached via
      # many hostnames (umbrel.local, LAN IP, Tailscale…) and sit behind
      # Umbrel's trusted auth proxy. Without this, the UI logs
      # "<origin> is not an accepted origin" and live updates break.
      - SUBLARR_CORS_ORIGINS=*
      # Media root — matches where the library is mounted below.
      - SUBLARR_MEDIA_PATH=/downloads
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Media mounted at the SAME path Sonarr/Radarr use (/downloads), so Sublarr
      # writes subtitle files next to the media without path mapping.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure

  autoconfig:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "1000:1000"
    command:
      - node
      - --input-type=module
      - --eval
      - |
        const log = message => console.log('[umbrel autoconfig] ' + message);
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function call(url, options = {}) {
            const res = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw new Error(url + ' answered HTTP ' + res.status + ' ' + (await res.text()).slice(0, 200));
            return res.status === 204 ? null : res.json();
        }

        async function retry(what, fn, attempts) {
            for (let i = 1; ; i++) {
                try {
                    return await fn();
                } catch (err) {
                    if (i >= attempts) throw new Error(what + ': ' + err.message);
                    await sleep(5000);
                }
            }
        }

        const SUBLARR = 'http://mathieu-sublarr_server_1:5765/api/v1/config';
        const ARRS = [
            { name: 'Sonarr', prefix: 'sonarr', url: 'http://sonarr_server_1:8989', key: process.env.SONARR_API_KEY?.trim() },
            { name: 'Radarr', prefix: 'radarr', url: 'http://radarr_server_1:7878', key: process.env.RADARR_API_KEY?.trim() },
        ].filter(arr => arr.key);

        async function main() {
            if (ARRS.length === 0) {
                log('no Sonarr or Radarr from the Umbrel App Store, nothing to add');
                return;
            }
            const config = await retry('Sublarr', () => call(SUBLARR), 36);
            const missing = ARRS.filter(arr => !config[arr.prefix + '_url']);
            if (missing.length === 0) {
                log('Sonarr and Radarr are already set, leaving them alone');
                return;
            }
            const update = {};
            for (const arr of missing) {
                update[arr.prefix + '_url'] = arr.url;
                update[arr.prefix + '_api_key'] = arr.key;
            }
            await call(SUBLARR, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(update) });
            log('added ' + missing.map(arr => arr.name).join(' and '));
        }

        main().catch(err => log('skipped: ' + err.message));
    environment:
      SONARR_API_KEY: ${APP_MATHIEU_SUBLARR_SONARR_API_KEY:-}
      RADARR_API_KEY: ${APP_MATHIEU_SUBLARR_RADARR_API_KEY:-}
    depends_on:
      - server
    restart: "no"
