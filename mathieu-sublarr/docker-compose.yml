version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sublarr_server_1
      APP_PORT: 5765

  server:
    image: ghcr.io/abrechen2/sublarr:1.17.0@sha256:16ca4923e3d05d3202d2c73b69b78d2aff8b900db37a5901336ff857531199da
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBLARR_CORS_ORIGINS=*
      - SUBLARR_MEDIA_PATH=/downloads
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
