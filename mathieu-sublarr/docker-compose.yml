version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sublarr_server_1
      APP_PORT: 5765

  server:
    image: ghcr.io/abrechen2/sublarr:1.17.4@sha256:3f3c01d284229722ac97cd1268c773395940f6ce0625d9e68f4ba201301634de
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SUBLARR_CORS_ORIGINS=*
      - SUBLARR_MEDIA_PATH=/downloads
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
