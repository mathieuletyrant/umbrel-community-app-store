version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-suggestarr_server_1
      APP_PORT: 5000

  server:
    image: ciuse99/suggestarr:v2.13.1@sha256:b0c038ffef3a9caf41ededd7ccd0a5f9375f390f578fb5dec7dfd89f74671239
    init: true
    environment:
      - TZ=Europe/Paris
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config/config_files
    restart: on-failure
