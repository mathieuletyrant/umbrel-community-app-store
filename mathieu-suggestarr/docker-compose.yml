version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-suggestarr_server_1
      APP_PORT: 5000

  server:
    image: ciuse99/suggestarr:v3.4.0@sha256:55220fbe60aa7ebad9440513b80d3204ab4103512ae4d86408407d8f7a33bb08
    init: true
    environment:
      - TZ=Etc/UTC
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config/config_files
    restart: on-failure
