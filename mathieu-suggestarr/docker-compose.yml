version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-suggestarr_server_1
      APP_PORT: 5000

  server:
    image: ciuse99/suggestarr:v3.0.0@sha256:499fd0226aacea1135b82af62c579149da2b6f741cebbe2fcc821eb446f61dd9
    init: true
    environment:
      - TZ=Etc/UTC
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config/config_files
    restart: on-failure
