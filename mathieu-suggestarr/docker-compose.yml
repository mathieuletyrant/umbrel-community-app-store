version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-suggestarr_server_1
      APP_PORT: 5000

  server:
    image: ciuse99/suggestarr:v3.1.0@sha256:b9cfa55bdffb24155e6908d8c904fa842a17c607810e665a544e34cc34bb427a
    init: true
    environment:
      - TZ=Etc/UTC
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config/config_files
    restart: on-failure
