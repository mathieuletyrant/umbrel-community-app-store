version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-snug_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/snug:0.7.0@sha256:54c22505b547a726d2fbc17cac9e34e9cd4752a96507333a8b0a9d1d21fce7be
    restart: on-failure
    environment:
      TZ: Etc/UTC
      SNUG_ORIGINS: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3077
    volumes:
      - ${APP_DATA_DIR}/data/snug:/data
