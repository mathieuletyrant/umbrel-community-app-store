version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-snug_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/snug:0.9.0@sha256:f87a66c5025afa3b409ac6601e1c2c1dfb65ab0eb704142b63757a331b02998a
    restart: on-failure
    environment:
      TZ: Etc/UTC
      SNUG_ORIGINS: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3077
    volumes:
      - ${APP_DATA_DIR}/data/snug:/data
