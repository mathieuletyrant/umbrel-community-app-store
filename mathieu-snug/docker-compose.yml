version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-snug_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/snug:0.3.0@sha256:3eed879da4fe7286f88489d569515ea0d86fe393651adcb64fe24cb01333d1f2
    restart: on-failure
    environment:
      TZ: Etc/UTC
      SNUG_ORIGINS: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3077
    volumes:
      - ${APP_DATA_DIR}/data/snug:/data
