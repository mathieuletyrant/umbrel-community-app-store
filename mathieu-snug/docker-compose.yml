version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-snug_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/snug:0.17.0@sha256:837cfe889ab6f399671e937f5e526f6fdaefbe282138fdab6a19fecd421d774c
    restart: on-failure
    environment:
      TZ: Etc/UTC
      SNUG_ORIGINS: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3077
    volumes:
      - ${APP_DATA_DIR}/data/snug:/data
