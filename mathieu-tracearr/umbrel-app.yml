releaseNotes: >-
  Members now only see the libraries their media server account can open. Admins can switch back from the personal dashboard even with no recent plays, and accounts that signed in through more than one of Plex, Jellyfin or Emby can be merged.


  This update also fixes the run list returning errors for runs about a library item, keeps Seerr and media server versions fresh after sync, and makes image precaching skip images the server can't serve.


  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v2.8.3

