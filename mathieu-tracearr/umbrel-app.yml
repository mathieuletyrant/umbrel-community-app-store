releaseNotes: >-
  The app moves from port 3000 to 3009, because ThunderHub from the Umbrel App Store already uses 3000 and the two apps could not be installed together. Update your bookmark if you open it by address.


  Tracearr now runs within a 3 GB memory limit, as its developer recommends. Before, its
  bundled PostgreSQL sized itself for all of your Umbrel's RAM and could take memory from your
  other apps. Your data is kept.


  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v2.7.1

