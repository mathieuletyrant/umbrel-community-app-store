releaseNotes: >-
  Members can now sign in to Tracearr with their Jellyfin, Emby or Plex account (including Jellyfin Quick Connect). It is off by default: turn it on in Settings → Sign-in. Note that every admin becomes a member on upgrade; give Admin back on their user page or under Settings → Sign-in.


  This release also adds a personal dashboard, a read-only "View as" mode for owners, and security fixes for sessions, Plex sign-in and the image proxy.


  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v2.8.0

