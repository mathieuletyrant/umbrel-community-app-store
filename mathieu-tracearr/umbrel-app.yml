releaseNotes: >-
  History, user pages and Stale Content are much faster on servers with
  years of plays, and library syncs on large libraries no longer run the
  database out of memory. Dates and times now follow your region, with a
  date format and first day of the week in Settings → General → Locale.
  Notifications (Telegram in particular) give clearer errors and no longer
  fail on slow connections. 3.1.1 updates Node to fix a Brotli security
  flaw.

  Full release notes can be found at
  https://github.com/connorgallopo/Tracearr/releases/tag/v3.1.1
