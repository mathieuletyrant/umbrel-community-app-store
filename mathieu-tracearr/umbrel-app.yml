releaseNotes: >-
  Automations can now fire when a stream passes the watched threshold, and
  Browse can filter by added date. The dashboard shows today's watch time in
  hours and minutes, and binge highlights rank shows per person. A few seconds
  of a title no longer counts as a viewer, and the Overview shelves cover
  exactly the days picked. Tracearr now runs on Node.js 26.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v3.1.4
