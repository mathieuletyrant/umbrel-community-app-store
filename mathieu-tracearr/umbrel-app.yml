releaseNotes: >-
  Linking your own Jellyfin or Emby account is now possible from Settings →
  Servers → Connections. A library that fails to sync (a slow Plex scan, for
  example) no longer stops the others, Plexamp playback is no longer
  recorded as downloads, several stats (completion rates, binge scores,
  Most Watched) are more accurate, and History, Violations and Settings open
  faster.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v3.1.2
