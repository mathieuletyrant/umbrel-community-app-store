releaseNotes: >-
  Tracearr's data now persists across restarts and updates: its database, Redis, settings and backups are stored in the app's data folder instead of anonymous Docker volumes that were replaced at every restart. Data from before this update isn't carried over, so create your account and add your servers once more after updating.

  The public API v2 gains live events over SSE, plus violations and server status. Titles in history, now playing and the map now link to their media pages. Server down and up automations fire once per outage, and editing a Jellyfin or Emby server accepts a new API key after the old one was revoked.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v2.7.0
