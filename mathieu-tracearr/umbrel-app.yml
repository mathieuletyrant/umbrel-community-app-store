releaseNotes: >-
  Tracearr now records which tofa or Silo profile played each stream, shows it on the
  account avatar and lets History filter by profile. It also monitors Silo servers, repairs
  imported Plex plays that showed under the wrong item after a Plex rebuild, and writes far
  less to disk during background jobs. This update changes how tofa requests are stored, so
  going back to 3.2 needs a backup taken beforehand.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v3.3.0
