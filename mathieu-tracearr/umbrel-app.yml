releaseNotes: >-
  Plex setup now accepts your server's own plex.direct address and only
  refuses Plex relay addresses. Mobile pushes replace instead of stacking, and
  an iPhone that was offline gets the alert it missed. Android phones in
  standby get push notifications right away. Jellyfin and Emby stream
  reporting is improved, and the 24-hour clock shows a leading zero.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v3.1.3
