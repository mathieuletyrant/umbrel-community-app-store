releaseNotes: >-
  Tracearr now monitors tofa servers (0.13.3 or newer), and a fresh install walks
  through signing in, connecting a server and importing history. History imports
  start right away and retry on their own, Jellyfin shows Direct Play, Direct Stream
  or Transcode correctly, and Live TV shows the program on air. Request ids are
  stored differently from this release on, so going back to an older version needs
  a backup made before upgrading.

  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v3.2.0
