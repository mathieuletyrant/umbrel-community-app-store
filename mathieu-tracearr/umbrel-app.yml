releaseNotes: >-
  The sidebar is shorter: Stats, Library and Automations are now tabbed sections that share one time range, and Violations moves under Automations. Stats gains a People tab ranking everyone by plays, hours, data and more, and a Genres tab. Music libraries now sync albums, with a Music tab in Browse, artist pages and listen time beside watch time.


  Stats rebuild in the background after updating, and the first scan is a full one so albums appear. The /api/v1/stats/users and /api/v1/stats/top-users endpoints were removed in favour of /api/v1/stats/people.


  Full release notes can be found at https://github.com/connorgallopo/Tracearr/releases/tag/v2.9.0

