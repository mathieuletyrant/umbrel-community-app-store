version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-tracearr_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/connorgallopo/tracearr:supervised-3.1.5@sha256:019d14cd11e0f30b77cb02a2709cbf6cef57cf2495fedd6fb54f91683247aab8
    init: true
    shm_size: 512mb
    mem_limit: 3g
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data/postgres
      - ${APP_DATA_DIR}/data/redis:/data/redis
      - ${APP_DATA_DIR}/data/tracearr:/data/tracearr
      - ${APP_DATA_DIR}/data/tracearr/backup:/data/backup
    restart: on-failure
