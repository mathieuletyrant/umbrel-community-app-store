version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-tracearr_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/connorgallopo/tracearr:supervised-3.1.1@sha256:442cd8597c9e6cfcf0fae29f37fad7934d657651bf524bb2a345c3d6767b4ccf
    init: true
    shm_size: 512mb
    mem_limit: 3g
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data/postgres
      - ${APP_DATA_DIR}/data/redis:/data/redis
      - ${APP_DATA_DIR}/data/tracearr:/data/tracearr
      - ${APP_DATA_DIR}/data/tracearr/backup:/data/backup
    restart: on-failure
