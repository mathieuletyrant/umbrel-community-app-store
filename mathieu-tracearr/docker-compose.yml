version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-tracearr_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/connorgallopo/tracearr:supervised-2.9.0@sha256:0600a9139f83fb6912dbbffadcdedbca710d113742c9bc8613f3659ed7263e1e
    init: true
    shm_size: 512mb
    mem_limit: 3g
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data/postgres
      - ${APP_DATA_DIR}/data/redis:/data/redis
      - ${APP_DATA_DIR}/data/tracearr:/data/tracearr
      - ${APP_DATA_DIR}/data/tracearr/backup:/data/backup
    restart: on-failure
