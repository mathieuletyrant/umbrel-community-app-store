version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-tracearr_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/connorgallopo/tracearr:supervised-3.2.0@sha256:9b8ed50c8cf8a6879fff385ac00c9f5a13910d236d2173102f509a92f5603656
    init: true
    shm_size: 512mb
    mem_limit: 3g
    environment:
      - TZ=Etc/UTC
      - LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/data/postgres
      - ${APP_DATA_DIR}/data/redis:/data/redis
      - ${APP_DATA_DIR}/data/tracearr:/data/tracearr
      - ${APP_DATA_DIR}/data/tracearr/backup:/data/backup
    restart: on-failure
