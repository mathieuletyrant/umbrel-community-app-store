version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-d3x_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          client_max_body_size 100m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-d3x_server_1:8733;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_set_header Cookie "d3x_session=${APP_SEED}";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/v3x0rv3x/d3x:1.1.38@sha256:250b30a8ab29a895e639bf95ab357610a9b3efa2247a016cb7dfaff5535990c2
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
      D3X_TOKEN: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
