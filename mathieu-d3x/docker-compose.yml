version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-d3x_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:b50897d5c7b1aa08067c3d90c5e8b3e47ec4e3c91c91446f67820228f7b41e34
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          client_max_body_size 100m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-d3x_server_1:8733;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_set_header Cookie "d3x_session=${APP_SEED}";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/v3x0rv3x/d3x:1.1.66@sha256:1da08e4011044287794c59a600f945505f24c4ae94ef7774d8ad5b0d30b63926
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
      D3X_TOKEN: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
