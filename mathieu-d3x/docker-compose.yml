version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-d3x_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          client_max_body_size 100m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-d3x_server_1:8733;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_set_header Cookie "d3x_session=${APP_SEED}";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/v3x0rv3x/d3x:1.1.42@sha256:b2633c8f3fdbdf4eb871fbda3455ad2ed70dde4a1b3279a4f9f3b529db918a31
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Etc/UTC
      D3X_TOKEN: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
