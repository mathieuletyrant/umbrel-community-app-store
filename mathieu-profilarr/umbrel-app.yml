releaseNotes: >-
  Adds named API keys with per-area permissions (existing keys become full-access "default" keys), password and SSO login together, optional Basic Auth for Radarr and Sonarr, and experimental Sonarr v5 support. Fixes three security issues (sanitized backup downloads, markdown and SQL from linked databases), and uses less memory. The local authentication bypass is removed: you always sign in.


  Full release notes can be found at https://github.com/Dictionarry-Hub/profilarr/releases/tag/v2.3.0
