version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-profilarr_server_1
      APP_PORT: 6868

  server:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0@sha256:ddcdd0f340043c2ec0a85ca74b9a6be9be42b1c0288c75fc36a26a43f695860b
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Europe/Paris
      - PARSER_HOST=parser
      - PARSER_PORT=5000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    depends_on:
      parser:
        condition: service_started
    restart: on-failure

  # Optional companion — only used for the custom-format / quality-profile
  # testing features. Kept internal (not exposed on the host).
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest@sha256:3cd3f8c4979ee66304a518462cc6c5b59825bae6b25e7dfa51b30178b9265df7
    init: true
    expose:
      - "5000"
    restart: on-failure
