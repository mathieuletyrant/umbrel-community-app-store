version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-profilarr_server_1
      APP_PORT: 6868

  server:
    image: ghcr.io/dictionarry-hub/profilarr:2.1.0@sha256:75a43c9c19c70f6e48315d4ed5cef3232d905da8fab397391a2078a5e0fd7ec1
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Europe/Paris
      - PARSER_HOST=parser
      - PARSER_PORT=5000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    depends_on:
      parser:
        condition: service_started
    restart: on-failure

  # Optional companion — only used for the custom-format / quality-profile
  # testing features. Kept internal (not exposed on the host).
  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest@sha256:83d668258b2a798adaf25dec0d78e5159953c3b015e2d31edb8e5b9859f3c591
    init: true
    expose:
      - "5000"
    restart: on-failure
