version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-profilarr_server_1
      APP_PORT: 6868

  server:
    image: ghcr.io/dictionarry-hub/profilarr:2.3.1@sha256:352e42dec74ecfd68d13bb198fbc6d9346e3a8c55003026e1814e59319a2176d
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=Etc/UTC
      - PARSER_HOST=mathieu-profilarr_parser_1
      - PARSER_PORT=5000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    depends_on:
      parser:
        condition: service_healthy
    restart: on-failure

  parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest@sha256:234084df7037e76b98c66f5ab220dc0d10ef8f34145ded57b9af257f057bdda6
    init: true
    expose:
      - "5000"
    restart: on-failure
