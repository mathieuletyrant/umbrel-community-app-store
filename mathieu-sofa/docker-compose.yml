version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sofa_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/jakejarvis/sofa:sha-0de7560@sha256:99747d681c4f5f7e8829019e09a7bdb152f8594779d297e63561cb482b4819e9
    environment:
      - TZ=Etc/UTC
      - BETTER_AUTH_SECRET=${APP_SEED}
      - BETTER_AUTH_URL=http://${DEVICE_DOMAIN_NAME}:7632
      - BETTER_AUTH_TRUSTED_ORIGINS=*
    volumes:
      - ${APP_DATA_DIR}/data/sofa:/data
    restart: on-failure
