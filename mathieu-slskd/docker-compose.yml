version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-slskd_server_1
      APP_PORT: 5030

  server:
    image: slskd/slskd:0.26.2@sha256:d0963a3e5b16facd295bf4f2156dad0182f246b1b21a032cae12f5494c694843
    init: true
    user: "1000:1000"
    environment:
      - TZ=Etc/UTC
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_DOWNLOADS_DIR=/downloads/soulseek/complete
      - SLSKD_INCOMPLETE_DIR=/downloads/soulseek/incomplete
      - SLSKD_HTTP_IP_ADDRESS=0.0.0.0
      - SLSKD_HTTPS_IP_ADDRESS=0.0.0.0
    ports:
      - "50300:50300/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/app:/app
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
