version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-freshrss-mcp_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/mcp*,/health"

  init:
    image: linuxserver/freshrss:1.30.1@sha256:bd13d4a611959bad42bd79965d3202c518494bd775be4a0f61e4b81098b18b01
    user: "1000:1000"
    working_dir: /app/www
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        export DATA_PATH=/config/www/freshrss/data

        user=""
        i=0
        while [ "$$i" -lt 30 ]; do
          user="$$(php cli/list-users.php 2>/dev/null | grep -E -m 1 '^[A-Za-z0-9_.@-]+$$' || true)"
          [ -n "$$user" ] && break
          i=$$((i + 1))
          sleep 2
        done
        if [ -z "$$user" ]; then
          echo "freshrss-mcp: no FreshRSS account found. Create your FreshRSS account, then restart this app." >&2
          exit 1
        fi

        php cli/reconfigure.php --api-enabled >/dev/null

        if [ ! -s /shared/api_password ]; then
          password="$$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40)"
          php cli/update-user.php --user "$$user" --api-password "$$password" >/dev/null
          printf '%s' "$$user" > /shared/username
          printf '%s' "$$password" > /shared/api_password
          echo "freshrss-mcp: API password generated for $$user"
          sleep 3
        else
          echo "freshrss-mcp: API password already set, keeping it"
        fi
    volumes:
      - ${UMBREL_ROOT}/app-data/freshrss/data:/config
      - ${APP_DATA_DIR}/data/shared:/shared
    restart: "no"

  web:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$arg_token $$token_auth {
          ""      $$http_authorization;
          default "Bearer $$arg_token";
        }
        server {
          listen 80;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-freshrss-mcp_server_1:8080;

          location = /freshrss {
            return 302 http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3432/;
          }

          location ~ ^/(mcp|health)$$ {
            set $$auth $$token_auth;
            set $$args "";
            proxy_pass $$upstream;
            proxy_set_header Authorization $$auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/leitosama/freshrss-mcp-server:latest@sha256:b723946d77b6ef05e8c9ba475d3c4cf2778d1f685395874100fef158ff8f2620
    entrypoint: ["sh", "-c"]
    command:
      - |
        export FRESHRSS_USERNAME="$$(cat /shared/username)"
        export FRESHRSS_API_PASSWORD="$$(cat /shared/api_password)"
        exec freshrss-mcp
    environment:
      TZ: Etc/UTC
      MCP_HOST: 0.0.0.0
      FRESHRSS_API_URL: http://freshrss_server_1:80/api/greader.php
      FRESHRSS_BASE_URL: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:3432
      API_KEY: ${APP_PASSWORD:?APP_PASSWORD is not set}
    volumes:
      - ${APP_DATA_DIR}/data/shared:/shared:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure

  widget:
    image: ghcr.io/mathieuletyrant/umbrel-widgets:0.1.0@sha256:8b7b1eb2e2571d857481c2a4801b1271836b0c6c7034617b2e05ba9e5adedafa
    user: "1000:1000"
    environment:
      WIDGET_APP: freshrss-mcp
      FRESHRSS_API_URL: http://freshrss_server_1:80/api/greader.php
      FRESHRSS_CREDENTIALS_DIR: /shared
    volumes:
      - ${APP_DATA_DIR}/data/shared:/shared:ro
    restart: on-failure
