manifestVersion: 1
id: mathieu-freshrss-mcp
storage:
  dataRoot: data
category: ai
name: FreshRSS MCP
tagline: Your FreshRSS feeds, as an MCP server for AI assistants
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-freshrss-mcp/icon.png
version: "0.1.0-patch.8"
port: 6262
description: >-
  FreshRSS MCP is a Model Context Protocol (MCP) server that lets an AI
  assistant (Claude, ChatGPT, or any MCP client) read your FreshRSS feeds:
  list your subscriptions and categories, fetch unread articles, read their
  content as clean Markdown, pull the full text of summary-only feeds, and mark
  articles as read. Ideal for a daily digest of what's new in the topics you
  follow.


  It also adds two home screen widgets, your latest unread articles or an
  overview of your counts: add one from "Edit widgets" on the umbrelOS home
  screen.


  🛠️ SETUP INSTRUCTIONS


  1. In FreshRSS, allow API access (Settings → Authentication) and set an API
  password for your account (Settings → Profile → API management). Then enter
  your FreshRSS username and that API password in this app's settings in
  umbrelOS (⋯ → Settings → Advanced settings).

  2. Point your MCP client at `http://umbrel.local:6262/mcp?token=<token>`, or
  at `http://umbrel.local:6262/mcp` with the header `Authorization: Bearer
  <token>`. The token is the password shown in this app's settings in umbrelOS
  (Default credentials). The URL form is for clients that can't send headers,
  like Home Assistant; the token then ends up in that client's logs.

  3. The Umbrel login isn't needed for `/mcp`: only the token opens it.

  ⚠️ The server image is built for amd64 (Intel/AMD) only.
developer: leitosama
website: https://github.com/leitosama/freshrss-mcp-server
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/umbrel-community-app-store
repo: https://github.com/leitosama/freshrss-mcp-server
support: https://github.com/leitosama/freshrss-mcp-server/issues
gallery: []
releaseNotes: >-
  This app no longer turns on FreshRSS's API and creates an API password on
  its own: enter your FreshRSS username and API password in its settings in
  umbrelOS. The password it created before is in
  ~/umbrel/app-data/mathieu-freshrss-mcp/data/shared/api_password on your
  Umbrel.

dependencies:
  - freshrss
path: /health
widgets:
  - id: "unread"
    type: "list"
    refresh: "2m"
    endpoint: "widget:3000/unread"
    link: "/freshrss"
    example:
      type: "list"
      link: ""
      items:
        - text: "The best mini PCs for a home server"
          subtext: "Tech news · 20 min. ago"
        - text: "Backing up your photos the easy way"
          subtext: "Self-hosting · 2 hr. ago"
        - text: "Ten years of open source RSS readers"
          subtext: "Open web · yesterday"
  - id: "overview"
    type: "four-stats"
    refresh: "5m"
    endpoint: "widget:3000/overview"
    link: "/freshrss"
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Unread"
          text: "128"
          subtext: "articles"
        - title: "Today"
          text: "34"
          subtext: "new"
        - title: "Starred"
          text: "12"
        - title: "Feeds"
          text: "42"
environment:
  - name: FRESHRSS_USERNAME
    services:
      - server
      - widget
    note: Your FreshRSS username.
  - name: FRESHRSS_API_PASSWORD
    services:
      - server
      - widget
    note: The API password of that account, set in FreshRSS → Settings → Profile → API management.
defaultUsername: mcp
deterministicPassword: true
permissions: []
