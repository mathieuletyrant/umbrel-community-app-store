version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-reclaimerr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/jessielw/reclaimerr:0.6.18@sha256:96754f0fb00edf3acd95d5e12d364e8ce5ae60e7481645307e7a967d611f663a
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=022
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/reclaimerr:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
