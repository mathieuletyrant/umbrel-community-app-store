version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-reclaimerr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/jessielw/reclaimerr:0.6.5@sha256:5551cac94b04b258d2260880b37a5321ca62699faedc90501ab0cd24fc627ceb
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=022
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/reclaimerr:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
