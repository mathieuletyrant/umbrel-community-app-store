version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-reclaimerr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/jessielw/reclaimerr:0.6.19@sha256:9157a6d32b30f981ab3f827d4aae4e8d57bacfd391449729b591426269d2f4ba
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=022
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/reclaimerr:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
