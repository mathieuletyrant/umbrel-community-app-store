version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-reclaimerr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/jessielw/reclaimerr:0.6.8@sha256:3696535683cadf2df7cc2691441f811922d85b1926521b245c13e57550f8c4da
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=022
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/reclaimerr:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
