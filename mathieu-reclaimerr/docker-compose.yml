version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-reclaimerr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/jessielw/reclaimerr:0.6.15@sha256:36d09399cf1c8d5bef5dd5e090f2829def7104d3c6a9a0560bb41bdb034d5093
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=022
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${APP_DATA_DIR}/data/reclaimerr:/app/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
