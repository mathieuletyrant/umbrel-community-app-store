version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-boxarr_server_1
      APP_PORT: 8888

  autoconfig:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    user: "1000:1000"
    command:
      - node
      - --input-type=module
      - --eval
      - |
        const log = message => console.log('[umbrel autoconfig] ' + message);
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function call(url, options = {}) {
            const res = await fetch(url, { ...options, signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw new Error(url + ' answered HTTP ' + res.status + ' ' + (await res.text()).slice(0, 200));
            return res.status === 204 ? null : res.json();
        }

        async function retry(what, fn, attempts) {
            for (let i = 1; ; i++) {
                try {
                    return await fn();
                } catch (err) {
                    if (i >= attempts) throw new Error(what + ': ' + err.message);
                    await sleep(5000);
                }
            }
        }

        import { existsSync, writeFileSync, renameSync } from 'node:fs';

        const CONFIG = '/config/local.yaml';
        const RADARR = 'http://radarr_server_1:7878';
        const key = process.env.RADARR_API_KEY?.trim();

        async function main() {
            if (existsSync(CONFIG)) {
                log('Boxarr is already configured, leaving it alone');
                return;
            }
            if (!key) {
                log('no Radarr from the Umbrel App Store, Boxarr will ask for it');
                return;
            }
            const radarr = path => call(RADARR + path, { headers: { 'X-Api-Key': key } });
            let folder;
            let profile;
            try {
                [folder, profile] = await retry('Radarr', async () => {
                    const [folders, profiles] = await Promise.all([radarr('/api/v3/rootfolder'), radarr('/api/v3/qualityprofile')]);
                    if (folders.length === 0 || profiles.length === 0) throw new Error('no library folder or quality profile yet');
                    return [folders.find(f => f.path.startsWith('/downloads/')) ?? folders[0], profiles.find(p => p.name === 'HD-1080p') ?? profiles[0]];
                }, 24);
            } catch (err) {
                log(err.message + ', Boxarr will ask for Radarr');
                return;
            }
            const yaml = [
                'radarr:',
                '  url: ' + JSON.stringify(RADARR),
                '  api_key: ' + JSON.stringify(key),
                '  root_folder: ' + JSON.stringify(folder.path),
                '  quality_profile_default: ' + JSON.stringify(profile.name),
                '',
            ].join('\n');
            writeFileSync(CONFIG + '.tmp', yaml, { mode: 0o600 });
            renameSync(CONFIG + '.tmp', CONFIG);
            log('connected to Radarr, library folder ' + folder.path + ', quality profile ' + profile.name);
        }

        main().catch(err => log('skipped: ' + err.message));
    environment:
      RADARR_API_KEY: ${APP_MATHIEU_BOXARR_RADARR_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: "no"

  server:
    image: ghcr.io/iongpt/boxarr:2.1.0@sha256:f4e99515090a2dde550a61beaa0caa6f7e2c31ce2b80ffe8a5f6424059317fad
    init: true
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    depends_on:
      autoconfig:
        condition: service_completed_successfully
    restart: on-failure
