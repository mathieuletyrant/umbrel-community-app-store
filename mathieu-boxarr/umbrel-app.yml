manifestVersion: 1
id: mathieu-boxarr
storage:
  dataRoot: data
category: media
name: Boxarr
tagline: Weekly box office tracking that syncs with Radarr
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-boxarr/icon.png
# renovate: datasource=docker depName=ghcr.io/iongpt/boxarr
version: "2.2.0"
port: 8891
description: >-
  Boxarr is an automated box office tracking application that integrates with
  Radarr to monitor, add, and manage the latest theatrical releases.


  It shows the current box office top 10 (from Box Office Mojo), their status in
  your Radarr library, and lets you manage quality profiles. Features include
  weekly auto-updates, genre-based root folders, auto-add with smart filters
  (genre, rating, release year), and a clean responsive web UI.


  🛠️ SETUP INSTRUCTIONS


  Boxarr is configured entirely from its web interface. After launching, open
  Boxarr and point it at your Radarr instance (install Radarr from the Umbrel App
  Store first). Then pick your quality profile and root folders, and Boxarr will
  keep the weekly top 10 in sync.
developer: iongpt
website: https://github.com/iongpt/boxarr
submitter: Mathieu Le Tyrant
submission: https://github.com/iongpt/boxarr
repo: https://github.com/iongpt/boxarr
support: https://github.com/iongpt/boxarr/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-boxarr/gallery-1.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-boxarr/gallery-2.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-boxarr/gallery-3.jpg
releaseNotes: >-
  Boxarr 2.1.2 is a security and bug-fix release. Other websites can no longer read your Radarr API key or change Boxarr: the setup page no longer shows the stored key (leave it blank to keep it) and cross-site requests are refused. New sequels and remakes are no longer matched to an older film you already have, a slow or unreachable Radarr no longer freezes Boxarr, and saving the setup page keeps the settings it does not show. Auto-add now honours the "search for movie" setting, and films with words like "Pictures" or "Studios" in the title stay on the chart.


  Full release notes can be found at https://github.com/iongpt/boxarr/releases/tag/v2.1.2
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
