  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-boxarr/gallery-3.jpg
releaseNotes: >-
  Auto-add now skips films on Radarr's exclusion list (needs Radarr 5.9 or later), so a film you deleted with "Add exclusion" is no longer added back; Add to Radarr still adds it by hand. The setup page now shows the Test Connection result, or why it failed. Title matching no longer cuts hyphenated titles ("Spider-Man" matched as "Spider") or links a charted film to another film of its franchise. The footer year now follows the date.


  Full release notes can be found at https://github.com/iongpt/boxarr/releases/tag/v2.3.0
dependencies: []
