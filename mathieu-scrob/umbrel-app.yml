releaseNotes: >-
  List imports from TMDB, TVDB, IMDb and MDBList now run as background jobs with a higher item cap. Fixes several next-up and calendar issues, Emby watch dates, multi-episode Jellyfin/Emby syncs and OIDC login over plain HTTP. Adds LOG_LEVEL and ACCESS_LOG_EXCLUDE to reduce access log noise.


  Full release notes can be found at https://github.com/ellite/scrob/releases/tag/v2.35.0
