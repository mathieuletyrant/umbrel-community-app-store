version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-cross-seed_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    init: true
    restart: on-failure
    command:
      - sh
      - -c
      - |
        cat > /usr/share/nginx/html/index.html <<'HTML'
        <!doctype html><html lang="en"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>cross-seed</title>
        <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:0 24px;line-height:1.6;color:#1a1a1a}code{background:#f0f0f0;padding:2px 6px;border-radius:4px}h1{margin-bottom:.2em}</style>
        </head><body>
        <h1>🌱 cross-seed</h1>
        <p>cross-seed runs <strong>headless</strong> in the background &mdash; it has no web interface. This page just confirms the app is installed.</p>
        <p>It finds torrents on your other trackers matching what you already seed in Transmission and injects them &mdash; more ratio without re-downloading anything.</p>
        <h3>Setup</h3>
        <p>cross-seed is set up for the Transmission app. Add your trackers' Torznab URLs (from Prowlarr: <code>http://prowlarr_server_1:9696/&lt;indexer id&gt;/api?apikey=&lt;Prowlarr API key&gt;</code>) and any other option in the config on your Umbrel host:</p>
        <p><code>~/umbrel/app-data/mathieu-cross-seed/data/config/config.js</code></p>
        <p>then restart the app. Watch progress with<br><code>docker logs -f mathieu-cross-seed_daemon_1</code></p>
        </body></html>
        HTML
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  daemon:
    image: ghcr.io/cross-seed/cross-seed:6.13.9@sha256:9279fa3b4c6f09915614ec819c6dc97e1e844d863b35c009ababd54bad0489d5
    user: "1000:1000"
    init: true
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
        [ -f /config/config.js ] || cat > /config/config.js <<'EOF'
        // cross-seed configuration. All options: https://www.cross-seed.org/docs/basics/options
        //
        // Add your trackers' Torznab URLs to the torznab list (from Prowlarr:
        // http://prowlarr_server_1:9696/<indexer id>/api?apikey=<Prowlarr API key>),
        // then restart the app.
        module.exports = {
          delay: 30,
          torznab: [],
          useClientTorrents: true,
          torrentClients: [
            "transmission:http://transmission_server_1:9091/transmission/rpc",
          ],
          action: "inject",
          linkDirs: ["/downloads/cross-seed"],
          linkType: "hardlink",
          matchMode: "flexible",
          rssCadence: "30 minutes",
          searchCadence: "1 day",
          excludeRecentSearch: "3 days",
          excludeOlder: "2 weeks",
          port: 2468,
        };
        EOF
        exec cross-seed daemon
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
