version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-cross-seed_daemon_1
      APP_PORT: 2468

  daemon:
    image: ghcr.io/cross-seed/cross-seed:7.0.0-33@sha256:ac6d4cc4130d90fc5fbb778111fb79ae0470a6564d33167e61821be1dee0be0d
    user: "1000:1000"
    init: true
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
        [ -f /config/config.js ] || [ -f /config/cross-seed.db ] || cat > /config/config.js <<'EOF'
        module.exports = {
          delay: 30,
          torznab: [],
          useClientTorrents: true,
          torrentClients: [
            "transmission:http://transmission_server_1:9091/transmission/rpc",
          ],
          action: "inject",
          linkDirs: ["/downloads/cross-seed"],
          linkType: "hardlink",
          matchMode: "flexible",
          rssCadence: "30 minutes",
          searchCadence: "1 day",
          excludeRecentSearch: "3 days",
          excludeOlder: "2 weeks",
          port: 2468,
        };
        EOF
        exec cross-seed daemon
    environment:
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
