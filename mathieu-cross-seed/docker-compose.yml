version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-cross-seed_web_1
      APP_PORT: 80

  web:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    init: true
    restart: on-failure
    command:
      - sh
      - -c
      - |
        cat > /usr/share/nginx/html/index.html <<'HTML'
        <!doctype html><html lang="en"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>cross-seed</title>
        <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:0 24px;line-height:1.6;color:#1a1a1a}code{background:#f0f0f0;padding:2px 6px;border-radius:4px}h1{margin-bottom:.2em}</style>
        </head><body>
        <h1>🌱 cross-seed</h1>
        <p>cross-seed runs <strong>headless</strong> in the background &mdash; it has no web interface. This page just confirms the app is installed.</p>
        <p>It finds torrents on your other trackers matching what you already seed in Transmission and injects them &mdash; more ratio without re-downloading anything.</p>
        <h3>Setup</h3>
        <p>Nothing to fill in if you use the Umbrel App Store apps: at each start, cross-seed picks up every enabled torrent indexer from <strong>Prowlarr</strong>, plus <strong>Sonarr</strong> and <strong>Radarr</strong> for ID lookups. Added an indexer in Prowlarr? Restart cross-seed.</p>
        <p>Other Torznab URLs and options go in the config on your Umbrel host:</p>
        <p><code>~/umbrel/app-data/mathieu-cross-seed/data/config/config.js</code></p>
        <p>then restart the app. Watch progress with<br><code>docker logs -f mathieu-cross-seed_daemon_1</code></p>
        </body></html>
        HTML
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  daemon:
    image: ghcr.io/cross-seed/cross-seed:6.13.7@sha256:a1fed512261fd968c55cb03c51cff9c6620aa76a34b3b591afca95c890aa8225
    init: true
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
        [ -f /config/config.js ] || cat > /config/config.js <<'EOF'
        // cross-seed configuration. All options: https://www.cross-seed.org/docs/basics/options
        //
        // Prowlarr's torrent indexers, Sonarr and Radarr from the Umbrel App Store
        // are filled in automatically each time the app starts, from
        // umbrel-autoconfig.json. Add any other Torznab URL to the torznab list
        // below, then restart the app.
        const umbrel = (() => {
          try {
            return JSON.parse(require("fs").readFileSync("/config/umbrel-autoconfig.json", "utf8"));
          } catch {
            return {};
          }
        })();

        module.exports = {
          delay: 30,
          torznab: [
            ...(umbrel.torznab || []),
          ],
          sonarr: umbrel.sonarr || [],
          radarr: umbrel.radarr || [],
          useClientTorrents: true,
          torrentClients: [
            "transmission:http://transmission_server_1:9091/transmission/rpc",
          ],
          action: "inject",
          linkDirs: ["/downloads/cross-seed"],
          linkType: "hardlink",
          matchMode: "flexible",
          rssCadence: "30 minutes",
          searchCadence: "1 day",
          excludeRecentSearch: "3 days",
          excludeOlder: "2 weeks",
          port: 2468,
        };
        EOF
        node --input-type=module <<'EOF' || true
        import { readFileSync, writeFileSync, renameSync } from 'node:fs';

        const FILE = '/config/umbrel-autoconfig.json';
        const PROWLARR = 'http://prowlarr_server_1:9696';
        const key = name => process.env[name]?.trim() || '';
        const log = message => console.log('[umbrel autoconfig] ' + message);
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function indexers(apiKey) {
            for (let i = 1; ; i++) {
                try {
                    const res = await fetch(PROWLARR + '/api/v1/indexer', { headers: { 'X-Api-Key': apiKey }, signal: AbortSignal.timeout(15000) });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return await res.json();
                } catch (err) {
                    if (i >= 6) throw err;
                    await sleep(10000);
                }
            }
        }

        let previous = {};
        try {
            previous = JSON.parse(readFileSync(FILE, 'utf8'));
        } catch {}

        const config = {
            torznab: [],
            sonarr: key('SONARR_API_KEY') ? ['http://sonarr_server_1:8989/?apikey=' + key('SONARR_API_KEY')] : [],
            radarr: key('RADARR_API_KEY') ? ['http://radarr_server_1:7878/?apikey=' + key('RADARR_API_KEY')] : [],
        };

        const prowlarrKey = key('PROWLARR_API_KEY');
        if (prowlarrKey) {
            try {
                const torrent = (await indexers(prowlarrKey)).filter(indexer => indexer.enable && indexer.protocol === 'torrent');
                config.torznab = torrent.map(indexer => PROWLARR + '/' + indexer.id + '/api?apikey=' + prowlarrKey);
                log('Prowlarr indexers: ' + (torrent.map(indexer => indexer.name).join(', ') || 'none enabled'));
            } catch (err) {
                config.torznab = previous.torznab || [];
                log('Prowlarr unreachable (' + err.message + '), keeping the ' + config.torznab.length + ' indexers from the last start');
            }
        } else {
            log('Prowlarr from the Umbrel App Store not found');
        }
        log('Sonarr: ' + (config.sonarr.length ? 'yes' : 'no') + ', Radarr: ' + (config.radarr.length ? 'yes' : 'no'));

        writeFileSync(FILE + '.tmp', JSON.stringify(config, null, 2) + '\n', { mode: 0o600 });
        renameSync(FILE + '.tmp', FILE);
        EOF
        exec cross-seed daemon
    environment:
      TZ: Etc/UTC
      PROWLARR_API_KEY: ${APP_MATHIEU_CROSS_SEED_PROWLARR_API_KEY:-}
      SONARR_API_KEY: ${APP_MATHIEU_CROSS_SEED_SONARR_API_KEY:-}
      RADARR_API_KEY: ${APP_MATHIEU_CROSS_SEED_RADARR_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
