version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-scryer_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/scryer-media/scryer:0.21.8@sha256:6ca95d989d30bb8f12ac6c5d277dc7e5fcf192f1a17e354c7223b2bb6d4ccd93
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
