version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-scryer_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/scryer-media/scryer:0.22.5@sha256:4b4f8dfd2c4250a6d968bb14d631930e4c5d101a37498bece22ab4b12fcaad15
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
