version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-labelarr_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/webhook"

  web:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PLEX_SIGNED_IN: ${APP_MATHIEU_LABELARR_PLEX_SIGNED_IN:-false}
      RADARR_FOUND: ${APP_MATHIEU_LABELARR_USE_RADARR:-false}
      SONARR_FOUND: ${APP_MATHIEU_LABELARR_USE_SONARR:-false}
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          client_max_body_size 20m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-labelarr_server_1:9090;

          location = /webhook {
            proxy_pass $$upstream/webhook;
          }

          location = /scan {
            proxy_pass $$upstream/scan$$is_args$$args;
          }

          location = /health {
            access_log off;
            proxy_pass $$upstream/health;
          }

          location = /plex {
            access_log off;
            proxy_connect_timeout 3s;
            proxy_pass http://host.docker.internal:32400/identity;
          }

          location = /log {
            access_log off;
            default_type text/plain;
            add_header Cache-Control no-store;
            alias /data/labelarr.log;
          }
        }
        CONF
        printf '{"plex":%s,"radarr":%s,"sonarr":%s}' "$$PLEX_SIGNED_IN" "$$RADARR_FOUND" "$$SONARR_FOUND" > /usr/share/nginx/html/wiring.json
        cat > /usr/share/nginx/html/index.html <<'HTML'
        <!doctype html><html lang="en"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Labelarr</title>
        <style>body{font-family:system-ui,sans-serif;max-width:760px;margin:8vh auto;padding:0 24px;line-height:1.6;color:#e8e8ef;background:#15161c}code{background:#262833;padding:2px 6px;border-radius:4px}h1{margin-bottom:.2em}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px 10px;border-bottom:1px solid #262833}.ok{color:#67b279}.ko{color:#f5a623}.hint{background:#262833;border-left:3px solid #f5a623;border-radius:4px;padding:10px 14px}button{background:#e5a00d;color:#15161c;border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}pre{background:#0d0e12;border-radius:6px;padding:12px;font-size:12px;overflow:auto;max-height:360px;white-space:pre-wrap;word-break:break-all}</style>
        </head><body>
        <h1>🏷️ Labelarr</h1>
        <p>Labelarr runs in the background: every hour it adds the TMDb keywords of your movies and shows to Plex as labels, so you can filter your libraries and build smart collections from them ("time travel", "heist", "based on novel"…).</p>
        <h3>Status</h3>
        <div id="status">Loading…</div>
        <h3>Connections</h3>
        <table id="wiring"></table>
        <p><button id="scan" disabled>Scan now</button> <span id="scanmsg"></span></p>
        <h3>Recent activity</h3>
        <pre id="log">Loading…</pre>
        <p>With Plex Pass, add <code>http://127.0.0.1:9095/webhook</code> as a webhook in Plex (Settings → Webhooks) so new media is labelled right away instead of at the next hourly run.</p>
        <script>
        const hints = [
          [/PLEX_TOKEN environment variable is required/, "Plex isn't installed or isn't signed in yet. Install Plex from the umbrelOS App Store, sign in, then restart Labelarr."],
          [/TMDB_READ_ACCESS_TOKEN environment variable is required/, "Add your TMDb read access token in Labelarr's settings in umbrelOS. It's free: themoviedb.org → Settings → API → \"API Read Access Token\"."],
          [/Failed to connect to TMDb/, "TMDb refused the token: check the TMDb read access token in Labelarr's settings in umbrelOS (the long \"API Read Access Token\", not the short API key)."],
          [/Error fetching libraries/, "Plex didn't answer with the saved token. Open Plex, check you are signed in, then restart Labelarr."],
          [/No (movie |TV show )?librar(y|ies) found/, "Labelarr needs a Movies and a TV Shows library in Plex. Create them, then restart Labelarr."],
          [/Failed to connect to (Radarr|Sonarr)/, "Radarr or Sonarr didn't answer. Check that it is running, then restart Labelarr."]
        ];
        const row = (name, ok, text) => "<tr><td>" + name + "</td><td class=" + (ok === null ? ">⏳ " : ok ? "ok>✅ " : "ko>⚠️ ") + text + "</td></tr>";
        async function refresh() {
          let log = "";
          try {
            const r = await fetch("log", { headers: { Range: "bytes=-32768" } });
            if (r.ok) log = await r.text();
          } catch {}
          const run = log.lastIndexOf("Labelarr v");
          const current = run >= 0 ? log.slice(run) : log;
          let running = false;
          try { running = (await fetch("health")).ok; } catch {}
          const status = document.getElementById("status");
          if (running) {
            const libs = current.match(/Found (\d+) libraries/);
            status.innerHTML = "<span class=ok>✅ Running" + (libs ? ", " + libs[1] + " Plex libraries found" : "") + ".</span>";
          } else {
            const hint = hints.find(([re]) => re.test(current));
            status.innerHTML = hint ? "<div class=hint>⚠️ " + hint[1] + "</div>" : "Starting…";
          }
          document.getElementById("scan").disabled = !running;
          let wiring = {};
          try { wiring = await (await fetch("wiring.json")).json(); } catch {}
          let plex = null;
          try { const r = await fetch("plex"); if (r.ok) plex = (await r.text()).match(/<MediaContainer[^>]* version="([^"]+)"/); } catch {}
          const linked = (app, found) => found ? (current.includes("Successfully connected to " + app) ? row(app, true, "Connected, used to find TMDb ids") : row(app, true, "Found, connects when Labelarr starts")) : row(app, false, "Not installed: optional, helps find TMDb ids");
          document.getElementById("wiring").innerHTML =
            row("Plex server", !!plex, plex ? "Reachable (Plex " + plex[1].split("-")[0] + ")" : "Not reachable: install Plex from the umbrelOS App Store") +
            row("Plex account", wiring.plex, wiring.plex ? "Signed in" : "Not signed in: sign in to Plex, then restart Labelarr") +
            (current.includes("Successfully connected to TMDb") ? row("TMDb", true, "Connected") : /TMDB_READ_ACCESS_TOKEN|Failed to connect to TMDb/.test(current) ? row("TMDb", false, "Token missing or refused: set it in Labelarr's settings in umbrelOS") : row("TMDb", null, "Checked once Plex is ready")) +
            linked("Radarr", wiring.radarr) + linked("Sonarr", wiring.sonarr);
          const pre = document.getElementById("log");
          pre.textContent = log ? log.split("\n").slice(-60).join("\n") : "No activity yet.";
          pre.scrollTop = pre.scrollHeight;
        }
        document.getElementById("scan").onclick = async () => {
          const r = await fetch("scan", { method: "POST" });
          document.getElementById("scanmsg").textContent = r.status === 202 ? "Scan started." : r.status === 409 ? "A scan is already running." : "Scan failed (HTTP " + r.status + ").";
          setTimeout(refresh, 2000);
        };
        refresh();
        setInterval(refresh, 15000);
        </script>
        </body></html>
        HTML
        exec nginx -g 'daemon off;'
    volumes:
      - ${APP_DATA_DIR}/data/labelarr:/data:ro
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/nullable-eth/labelarr:v1.4.0@sha256:ee999233deb7925e1a3d9664aa319eea63c5ddcaa7af0839223e4885e5e5fb13
    user: "0:0"
    init: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -o pipefail
        until ./labelarr 2>&1 | tee /data/labelarr.log; do
          echo "[WAIT] Labelarr stopped, retrying in 60s" | tee -a /data/labelarr.log
          sleep 60
        done
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      DATA_DIR: /data
      PLEX_SERVER: host.docker.internal
      PLEX_PORT: "32400"
      PLEX_TOKEN: ${APP_MATHIEU_LABELARR_PLEX_TOKEN:-}
      MOVIE_PROCESS_ALL: "true"
      TV_PROCESS_ALL: "true"
      WEBHOOK_ENABLED: "true"
      WEBHOOK_PORT: "9090"
      USE_RADARR: ${APP_MATHIEU_LABELARR_USE_RADARR:-false}
      RADARR_URL: http://radarr_server_1:7878
      RADARR_API_KEY: ${APP_MATHIEU_LABELARR_RADARR_API_KEY:-}
      USE_SONARR: ${APP_MATHIEU_LABELARR_USE_SONARR:-false}
      SONARR_URL: http://sonarr_server_1:8989
      SONARR_API_KEY: ${APP_MATHIEU_LABELARR_SONARR_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data/labelarr:/data
    restart: on-failure
