releaseNotes: >-
  CSV import of bank and card statements now works on every non-investment
  account, and AI categorization adds Mistral, Gemini and any
  OpenAI-compatible server. Adds OKX exchange sync, Gulf currencies, editable
  categorization rules and a proper home-screen icon. Shares and ETFs are now
  priced by their ISIN, and fixes land for La Banque Postale, Natixis, BNP
  Paribas, American Express, BoursoBank and Enable Banking savings accounts.

  Full release notes can be found at https://github.com/Cloeille/picsou-finance/releases/tag/1.3.1
