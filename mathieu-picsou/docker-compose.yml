version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-picsou_server_1
      APP_PORT: 8080
      PROXY_AUTH_WHITELIST: "/mcp,/mcp/*,/.well-known/*,/oauth2/*"

  server:
    image: ghcr.io/cloeille/picsou-finance:1.3.1@sha256:38ff883183879bd4d2e4cca3514693b5f6d15d50a918c747d5d8483d1eb2f3ce
    restart: on-failure
    environment:
      TZ: Etc/UTC
      DATABASE_URL: sqlite:///data/picsou.db
      APP_NATIVE_SIDECARS: "true"
      MCP_PROTOCOL: STREAMABLE
      PUBLIC_BASE_URL: http://${DEVICE_DOMAIN_NAME:-umbrel.local}:8484
    volumes:
      - ${APP_DATA_DIR}/data/picsou:/data
