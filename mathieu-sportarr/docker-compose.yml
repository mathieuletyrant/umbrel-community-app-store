version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sportarr_server_1
      APP_PORT: 1867

  server:
    image: sportarr/sportarr:4.1.10.1120@sha256:32ae2fc94765945889297fd2544c1b1ba8cec7c7e28aea1e2ccef9a0f184e816
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
