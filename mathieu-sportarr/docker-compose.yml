version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-sportarr_server_1
      APP_PORT: 1867

  server:
    image: sportarr/sportarr:4.1.11.1121@sha256:5747ba701adac29fdf3c5139e4a9437c4b9d4f61ce8cddfe7a8b8194bd8fc46a
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - UMASK=002
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
