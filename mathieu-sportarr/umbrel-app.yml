manifestVersion: 1
id: mathieu-sportarr
storage:
  dataRoot: data
category: media
name: Sportarr
tagline: PVR for sports — monitors leagues, grabs releases, organizes your library
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-sportarr/icon.png
# renovate: datasource=docker depName=sportarr/sportarr
version: "4.1.10.1120"
port: 1867
description: >-
  Sportarr is a sports PVR built in the style of Sonarr and Radarr. It monitors
  leagues and events across major sports — fighting, football, soccer,
  basketball, racing and more — searches your Usenet and torrent indexers for
  releases, then renames, organizes and imports the files into your media
  library.


  It handles quality upgrades, multi-part events (e.g. prelims + main card for
  fights), subtitle fetching via Bazarr, and integrates with Plex, Jellyfin and
  Emby. Notifications go out through Discord, ntfy, Apprise, webhooks or custom
  scripts. An alpha IPTV DVR can also record events directly.


  🛠️ SETUP INSTRUCTIONS


  Add your indexers (ideally via Prowlarr) and a download client under Settings.
  Point your root folder at a subfolder of /downloads (the same share your other
  *arr apps use), so imports line up with no path mapping. Config is stored at
  /config.
developer: Sportarr
website: https://github.com/Sportarr/Sportarr
submitter: Mathieu Le Tyrant
submission: https://github.com/Sportarr/Sportarr
repo: https://github.com/Sportarr/Sportarr
support: https://github.com/Sportarr/Sportarr/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-sportarr/gallery-1.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-sportarr/gallery-2.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-sportarr/gallery-3.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-sportarr/gallery-4.jpg
releaseNotes: >-
  Better release matching for NASCAR, MotoGP, Formula One and playoff games, with stale pre-event releases rejected. New in-app support reporting previews redacted diagnostics before submission, and preseason, postseason and finals can be monitored for no teams, selected teams or all teams. IPTV recordings can optionally be replaced by indexer releases (off by default), and Transmission download directories and labels are now applied.


  Database migrations run automatically on first start; back up your database before updating. New first-run quality defaults only affect new installs.


  Full release notes can be found at https://github.com/Sportarr/Sportarr/releases/tag/v4.1.10.1120
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
