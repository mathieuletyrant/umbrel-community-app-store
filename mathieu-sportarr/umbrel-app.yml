releaseNotes: >-
  Eight releases of fixes and features since 4.1.1. Sportarr is now much better at picking the right game: date, league, round and session checks were tightened across manual search, automatic search, RSS and imports, so yesterday's match in the same series is no longer grabbed by mistake. The IPTV section is reorganised around Guide, Channels, Recordings and Options, with optional HLS playback profiles and a larger EPG download limit. Downloads and imports honour quality profiles and custom format scores everywhere, ambiguous multi-video downloads are held for manual selection, and the current queue is shown in the sidebar. New optional event-type folders can group wrestling, fighting and motorsport events inside season folders.

  Database migrations run automatically on first start; back up your database before updating. Event-type grouping is off by default and only applies to new imports.

  Full release notes can be found at https://github.com/Sportarr/Sportarr/releases/tag/v4.1.9.1119
permissions:
  - STORAGE_DOWNLOADS
