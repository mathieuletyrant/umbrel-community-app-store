  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-tdarr/gallery-4.jpg
releaseNotes: >-
  Improves library scan reliability when a folder can't be read (permissions or network issues), improves classic transcode and health check reliability, and fixes library scans missing files on some Windows drives. Also fixes unmapped Node path translation in certain scenarios, jobs failing after lowering a Node's worker limit, and high CPU usage from folder watching on very large libraries.


  Full release notes can be found at https://github.com/HaveAGitGat/Tdarr/releases
dependencies: []
