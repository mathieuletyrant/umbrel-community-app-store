  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-floppy/gallery-3.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-floppy/gallery-4.jpg
releaseNotes: >-
  Adds custom rating scales with weighted criteria and half stars, an optional
  one-way sync of watched history to SIMKL, support for several Jellyfin servers
  per account, Rotten Tomatoes scores and Trakt links on detail pages, and game
  controller navigation in the web app. Lists can now hold cast, crew and authors,
  periodic import schedules can be edited in place, and fixes cover Plex, Jellyfin,
  Trakt and MyAnimeList imports, TV show status and SQLite responsiveness.


  Full release notes can be found at https://github.com/dannyvfilms/Floppy/releases/tag/v26.11.26
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: REGISTRATION
    services:
      - server
    default: "True"
    options:
      - "True"
      - "False"
    note: Set to False once your account exists, so nobody else can sign up.
  - name: URLS
    services:
      - server
    note: Only if you open Floppy from a domain of your own (Cloudflare Tunnel, reverse proxy) — that full address, e.g. https://floppy.example.com. Leave empty for umbrel.local, the IP or Tailscale.
permissions: []
