version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-dispatcharr_server_1
      APP_PORT: 9191
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/dispatcharr/dispatcharr:0.34.0@sha256:bcf8dda41864e52b00f30136d882d8b61299a1ca6612d61124850186b2320f60
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
    restart: on-failure
