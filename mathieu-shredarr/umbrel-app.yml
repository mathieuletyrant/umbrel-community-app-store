releaseNotes: >-
  Settings now has a left-hand menu that opens one section at a time, and Connections
  shows a red dot when an app is unreachable. New Settings option to choose whether
  to keep the .torrent files used by Redownload, and for how long (default one year,
  applied to existing installs too). Adds an optional read-only mode for test copies.


  Full release notes can be found at https://github.com/jschaef80/shredarr/releases/tag/v2.2.0
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
