manifestVersion: 1
id: mathieu-shredarr
storage:
  dataRoot: data
category: media
name: Shredarr
tagline: Delete it in Jellyfin or Plex, and it's gone everywhere
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-shredarr/icon.png
# renovate: datasource=docker depName=ghcr.io/jimbos-slop-shop/shredarr
version: "2.3.2"
port: 8188
description: >-
  When you delete a movie, show, season or episode in Jellyfin or Plex, Shredarr
  cleans it up everywhere else: Sonarr and Radarr, Seerr (Jellyseerr/Overseerr)
  and your torrent client (Transmission, qBittorrent or Deluge).


  The torrent keeps seeding until your seeding rule (time and/or ratio, per
  category, show, movie or tracker) is met, then it is removed with its data.
  Season packs and cross-seeds are handled safely, Undo brings an item back
  while it is still seeding, and Redownload brings it back afterwards.


  🛠️ SETUP INSTRUCTIONS


  1. Open Shredarr and create its password.

  2. In Settings → Connections, add Sonarr, Radarr, your torrent client and your
  media server with their API keys. The addresses of your Umbrel apps are in
  the "Connecting apps" table of this store's README:
  https://github.com/mathieuletyrant/umbrel-community-app-store#-connecting-apps

  3. Jellyfin: under Jellyfin webhook, enter http://mathieu-shredarr_server_1:8089
  and click "Set up Jellyfin webhook" (needs Jellyfin's Webhook plugin). Plex:
  nothing to set up, Shredarr watches your library folders; turn on "Allow
  media deletion" in Plex.

  4. Pick a default seeding rule and leave Dry run on until the Activity tab
  shows it doing the right thing.
