releaseNotes: >-
  Shredarr moved to github.com/jimbos-slop-shop/shredarr and its Docker image to
  ghcr.io/jimbos-slop-shop/shredarr: this update switches to the new image, the
  old one gets no new versions. Settings, history and saved .torrent files are
  kept.


  Also fixes the cleanup sweep stopping when Sonarr or Radarr is down during the
  low disk space pass, a successful delete logged as failed on an empty reply,
  random Plex failures when two things use the connection at once, settings not
  saving on shares that forbid changing file permissions, and the "new version"
  notice. Half-written .torrent files are removed after an hour, and wrong
  passwords are now counted per connection too.


  Full release notes can be found at https://github.com/jimbos-slop-shop/shredarr/releases/tag/v2.3.2
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
