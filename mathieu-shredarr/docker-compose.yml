version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-shredarr_server_1
      APP_PORT: 8089

  server:
    image: ghcr.io/jschaef80/shredarr:2.2.0@sha256:2540dce4c8af733895926f5e9d7200eca4727c44668b4e61ca45a7eb863c922b
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
