version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-shredarr_server_1
      APP_PORT: 8089

  server:
    image: ghcr.io/jimbos-slop-shop/shredarr:2.3.2@sha256:101adba611d78752a0ec535260166217e289c20cb0572d2367f3b129508ec68d
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
