version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-shredarr_server_1
      APP_PORT: 8089

  server:
    image: ghcr.io/jimbos-slop-shop/shredarr:2.3.3@sha256:ef7857d0fdbc6836b4eaf24830f8efdf2d5378c5eabe0d00f96f2d681365b30d
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
