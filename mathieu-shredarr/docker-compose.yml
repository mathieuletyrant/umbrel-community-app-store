version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-shredarr_server_1
      APP_PORT: 8089

  server:
    image: ghcr.io/jschaef80/shredarr:2.3.0@sha256:7ce66b68fbafa43a801699c8462994f4e7c69974433ad08c5701a79870d1aa78
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
