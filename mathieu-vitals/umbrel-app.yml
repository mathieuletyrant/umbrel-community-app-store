manifestVersion: 1
id: mathieu-vitals
storage:
  dataRoot: data
category: media
name: Vitals
tagline: Live numbers and health of your media stack, as one JSON API
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/umbrel-widgets
version: "0.3.0"
port: 6565
description: >-
  Vitals reads the apps of your media stack and answers with one small JSON
  document: what is queued, missing and coming up in Radarr and Sonarr, what
  Transmission is downloading and how fast, and whether each app is healthy.
  Point your own dashboard at it instead of wiring every app's API and key
  yourself.


  It plugs itself into the Radarr, Sonarr and Transmission apps installed on
  your Umbrel: it finds their API keys on its own. An app installed later is
  picked up the next time Vitals restarts.


  It also adds a home screen widget with your downloads, queues and missing
  media: add it from "Edit widgets" on the umbrelOS home screen.


  🛠️ API


  - `GET /v1/summary`: every app, with an overall `healthy` flag.

  - `GET /v1/apps/<radarr|sonarr|transmission>`: one app.

  - Send the header `Authorization: Bearer <token>`. The token is the password
  shown in this app's settings in umbrelOS (Default credentials). The Umbrel
  login isn't needed for `/v1/*`: only the token opens it.

  - Each app reports `status` (`ok`, `error` or `not-configured`), `healthy`
  (an app is unhealthy when it is unreachable or reports an error in its own
  health checks; warnings are listed without changing it) and its numbers in
  `data`. Answers are cached for 10 seconds.


  Opening the app shows the same numbers on a status page.
developer: Mathieu Le Tyrant
website: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/widgets
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/umbrel-community-app-store
repo: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/widgets
support: https://github.com/mathieuletyrant/umbrel-community-app-store/issues
gallery: []
releaseNotes: >-
  First version: Radarr, Sonarr and Transmission, with a health status for each
  app and for the whole stack.
dependencies: []
path: ""
widgets:
  - id: "media"
    type: "four-stats"
    refresh: "30s"
    endpoint: "server:3001/media"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Downloading"
          text: "3"
          subtext: "↓ 4.2 MB/s"
        - title: "Movies"
          text: "2"
          subtext: "queued"
        - title: "Episodes"
          text: "5"
          subtext: "queued"
        - title: "Missing"
          text: "23"
defaultUsername: api
deterministicPassword: true
permissions: []
