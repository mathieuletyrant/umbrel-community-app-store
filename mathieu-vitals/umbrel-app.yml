manifestVersion: 1
id: mathieu-vitals
storage:
  dataRoot: data
category: media
name: Vitals
tagline: Health of your media stack's apps, as one JSON API
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/vitals
version: "0.4.0"
port: 6565
description: >-
  Vitals runs the health checks of the apps of your media stack and answers
  with one small JSON document: whether each app is up, the warnings and errors
  it reports itself, and an overall `healthy` flag. Point your own dashboard at
  it instead of wiring every app's API and key yourself.


  Apps it checks: Radarr, Sonarr, Prowlarr, Bazarr, Seerr (Jellyseerr or
  Overseerr), Transmission, qBittorrent, Maintainerr, Healarr, Cleanuparr and
  Tracearr. Paste the API key of each app you use in this app's settings in
  umbrelOS (⋯ → Settings → Advanced settings), and pick Transmission (or
  Transmission VPN), qBittorrent (or qBittorrent VPN, with its password) and
  Maintainerr from their list. The addresses of the Umbrel App Store apps are already
  filled in. Apps left empty are reported as `not-configured`.


  What each app reports: the *arr apps and Bazarr their own health checks,
  Transmission and qBittorrent the torrents in error, Maintainerr and
  Cleanuparr the apps they can't reach, Healarr the corrupted files waiting
  for a fix, Tracearr the media servers it can't reach. Seerr is healthy when
  it answers.


  🛠️ API


  - `GET /v1/summary`: every app, with an overall `healthy` flag.

  - `GET /v1/apps/<id>`: one app (`radarr`, `sonarr`, `prowlarr`, `bazarr`,
  `seerr`, `transmission`, `qbittorrent`, `maintainerr`, `healarr`,
  `cleanuparr`, `tracearr`).

  - Send the header `Authorization: Bearer <token>`. The token is the password
  shown in this app's settings in umbrelOS (Default credentials). The Umbrel
  login isn't needed for `/v1/*`: only the token opens it.

  - Each app reports `status` (`ok`, `error` or `not-configured`), `healthy`
  (an app is unhealthy when it is unreachable or reports an error; warnings
  are listed in `issues` without changing it). Answers are cached for 10
  seconds.


  The keys never leave your Umbrel: Vitals never returns them. Opening the app shows the same health on a status page.
developer: Mathieu Le Tyrant
website: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/packages/vitals
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/umbrel-community-app-store
repo: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/packages/vitals
support: https://github.com/mathieuletyrant/umbrel-community-app-store/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/gallery-1.jpg
releaseNotes: >-
  Vitals now only checks the health of your apps: the numbers (queues,
  downloads, requests…) are gone from the API and the status page, and so is
  the home screen widget. The API answers `version: 2`, without `data`. A
  status card now reads "Warning" when an app reports only warnings.

dependencies: []
path: ""
environment:
  - name: RADARR_API_KEY
    services:
      - server
    note: Radarr's API key, from Settings → General. Leave empty to skip Radarr.
  - name: RADARR_URL
    services:
      - server
    default: http://radarr_server_1:7878
    note: Only if Radarr isn't the Umbrel App Store app.
  - name: SONARR_API_KEY
    services:
      - server
    note: Sonarr's API key, from Settings → General. Leave empty to skip Sonarr.
  - name: SONARR_URL
    services:
      - server
    default: http://sonarr_server_1:8989
    note: Only if Sonarr isn't the Umbrel App Store app.
  - name: PROWLARR_API_KEY
    services:
      - server
    note: Prowlarr's API key, from Settings → General. Leave empty to skip Prowlarr.
  - name: PROWLARR_URL
    services:
      - server
    default: http://prowlarr_server_1:9696
    note: Only if Prowlarr isn't the Umbrel App Store app.
  - name: BAZARR_API_KEY
    services:
      - server
    note: Bazarr's API key, from Settings → General → Security. Leave empty to skip Bazarr.
  - name: BAZARR_URL
    services:
      - server
    default: http://bazarr_server_1:6767
    note: Only if Bazarr isn't the Umbrel App Store app.
  - name: SEERR_API_KEY
    services:
      - server
    note: Seerr's API key, from Settings → General. Leave empty to skip Seerr.
  - name: SEERR_URL
    services:
      - server
    default: http://jellyseerr_server_1:5055
    note: Only if Seerr isn't the Umbrel App Store app. With Overseerr, use http://overseerr_server_1:5055.
  - name: HEALARR_API_KEY
    services:
      - server
    note: Healarr's API key, from its settings. Leave empty to skip Healarr.
  - name: HEALARR_URL
    services:
      - server
    default: http://mathieu-healarr_server_1:3090
    note: Only if Healarr isn't the Umbrel App Store app.
  - name: CLEANUPARR_API_KEY
    services:
      - server
    note: Cleanuparr's API key, from its account settings. Leave empty to skip Cleanuparr.
  - name: CLEANUPARR_URL
    services:
      - server
    default: http://mathieu-cleanuparr_server_1:11011
    note: Only if Cleanuparr isn't the Umbrel App Store app.
  - name: TRACEARR_API_KEY
    services:
      - server
    note: A Tracearr public API token (trr_pub_…), created in its settings. Leave empty to skip Tracearr.
  - name: TRACEARR_URL
    services:
      - server
    default: http://mathieu-tracearr_server_1:3000
    note: Only if Tracearr isn't the Umbrel App Store app.
  - name: TRANSMISSION_URL
    services:
      - server
    options:
      - http://transmission_server_1:9091/transmission/rpc
      - http://mathieu-transmission-vpn_gluetun_1:9091/transmission/rpc
    note: Pick the address of your Transmission app, or of Transmission VPN, to read it (its RPC must have no login).
  - name: QBITTORRENT_URL
    services:
      - server
    options:
      - http://qbittorrent_server_1:8080
      - http://mathieu-qbittorrent-vpn_gluetun_1:8080
    note: Pick the address of your qBittorrent app, or of qBittorrent VPN, to read it.
  - name: QBITTORRENT_USERNAME
    services:
      - server
    default: admin
    note: Only if your qBittorrent Web UI username isn't admin.
  - name: QBITTORRENT_PASSWORD
    services:
      - server
    note: Your qBittorrent Web UI password (for qBittorrent VPN, the default password shown in its settings in umbrelOS).
  - name: MAINTAINERR_URL
    services:
      - server
    options:
      - http://mathieu-maintainerr_server_1:6246
    note: Pick the Maintainerr app's address to read it.
defaultUsername: api
deterministicPassword: true
permissions: []
