manifestVersion: 1
id: mathieu-vitals
storage:
  dataRoot: data
category: media
name: Vitals
tagline: Live numbers and health of your media stack, as one JSON API
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/icon.png
# renovate: datasource=docker depName=ghcr.io/mathieuletyrant/vitals
version: "0.2.2"
port: 6565
description: >-
  Vitals reads the apps of your media stack and answers with one small JSON
  document: queues, missing and upcoming media, downloads, subtitles, requests,
  library cleanup and file health, and whether each app is healthy. Point your
  own dashboard at it instead of wiring every app's API and key yourself.


  Apps it reads: Radarr, Sonarr, Prowlarr, Bazarr, Seerr (Jellyseerr or
  Overseerr), Transmission, Maintainerr, Healarr, Cleanuparr and Tracearr.
  Set the address and API key of each app you use in this app's settings in
  umbrelOS (⋯ → Settings → Advanced settings); each note gives the address of
  the Umbrel App Store app. Apps left empty are reported as `not-configured`.


  It also adds a home screen widget with your downloads, queues and missing
  media: add it from "Edit widgets" on the umbrelOS home screen.


  🛠️ API


  - `GET /v1/summary`: every app, with an overall `healthy` flag.

  - `GET /v1/apps/<id>`: one app (`radarr`, `sonarr`, `prowlarr`, `bazarr`,
  `seerr`, `transmission`, `maintainerr`, `healarr`, `cleanuparr`,
  `tracearr`).

  - Send the header `Authorization: Bearer <token>`. The token is the password
  shown in this app's settings in umbrelOS (Default credentials). The Umbrel
  login isn't needed for `/v1/*`: only the token opens it.

  - Each app reports `status` (`ok`, `error` or `not-configured`), `healthy`
  (an app is unhealthy when it is unreachable or reports an error in its own
  health checks; warnings are listed without changing it) and its numbers in
  `data`. Answers are cached for 10 seconds.


  The keys never leave your Umbrel: Vitals never returns them. Opening the app shows the same numbers on a status page.
developer: Mathieu Le Tyrant
website: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/packages/vitals
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/umbrel-community-app-store
repo: https://github.com/mathieuletyrant/umbrel-community-app-store/tree/master/packages/vitals
support: https://github.com/mathieuletyrant/umbrel-community-app-store/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/gallery-1.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-vitals/gallery-2.jpg
releaseNotes: >-
  Vitals no longer finds the other apps and their keys on its own: set the
  address and API key of each app in its settings in umbrelOS.

dependencies: []
path: ""
widgets:
  - id: "media"
    type: "four-stats"
    refresh: "30s"
    endpoint: "server:3001/media"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Downloading"
          text: "3"
          subtext: "↓ 4.2 MB/s"
        - title: "Movies"
          text: "2"
          subtext: "queued"
        - title: "Episodes"
          text: "5"
          subtext: "queued"
        - title: "Missing"
          text: "23"
environment:
  - name: RADARR_URL
    services:
      - server
    note: Radarr's address, e.g. http://radarr_server_1:7878. Leave empty to skip Radarr.
  - name: RADARR_API_KEY
    services:
      - server
    note: Radarr's API key, from Settings → General.
  - name: SONARR_URL
    services:
      - server
    note: Sonarr's address, e.g. http://sonarr_server_1:8989. Leave empty to skip Sonarr.
  - name: SONARR_API_KEY
    services:
      - server
    note: Sonarr's API key, from Settings → General.
  - name: PROWLARR_URL
    services:
      - server
    note: Prowlarr's address, e.g. http://prowlarr_server_1:9696. Leave empty to skip Prowlarr.
  - name: PROWLARR_API_KEY
    services:
      - server
    note: Prowlarr's API key, from Settings → General.
  - name: BAZARR_URL
    services:
      - server
    note: Bazarr's address, e.g. http://bazarr_server_1:6767. Leave empty to skip Bazarr.
  - name: BAZARR_API_KEY
    services:
      - server
    note: Bazarr's API key, from Settings → General → Security.
  - name: SEERR_URL
    services:
      - server
    note: Seerr's address, e.g. http://jellyseerr_server_1:5055 (Jellyseerr) or http://overseerr_server_1:5055 (Overseerr). Leave empty to skip Seerr.
  - name: SEERR_API_KEY
    services:
      - server
    note: Seerr's API key, from Settings → General.
  - name: TRANSMISSION_URL
    services:
      - server
    note: Transmission's RPC address (with no login set), e.g. http://transmission_server_1:9091/transmission/rpc. Leave empty to skip Transmission.
  - name: MAINTAINERR_URL
    services:
      - server
    note: Maintainerr's address, e.g. http://mathieu-maintainerr_server_1:6246. Leave empty to skip Maintainerr.
  - name: HEALARR_URL
    services:
      - server
    note: Healarr's address, e.g. http://mathieu-healarr_server_1:3090. Leave empty to skip Healarr.
  - name: HEALARR_API_KEY
    services:
      - server
    note: Healarr's API key, from its settings.
  - name: CLEANUPARR_URL
    services:
      - server
    note: Cleanuparr's address, e.g. http://mathieu-cleanuparr_server_1:11011. Leave empty to skip Cleanuparr.
  - name: CLEANUPARR_API_KEY
    services:
      - server
    note: Cleanuparr's API key, from its account settings.
  - name: TRACEARR_URL
    services:
      - server
    note: Tracearr's address, e.g. http://mathieu-tracearr_server_1:3000. Leave empty to skip Tracearr.
  - name: TRACEARR_API_KEY
    services:
      - server
    note: Tracearr's API key, a public API token (trr_pub_…) created in its settings.
defaultUsername: api
deterministicPassword: true
permissions: []
