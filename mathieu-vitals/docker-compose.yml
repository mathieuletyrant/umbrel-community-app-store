version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-vitals_server_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/v1/*,/health"

  server:
    image: ghcr.io/mathieuletyrant/vitals:0.2.0@sha256:9ff5ded2db25d2b2b5f0efc808ca3c59781ed164d2cb519225db3bb90bd3762c
    environment:
      VITALS_TOKEN: ${APP_PASSWORD:?APP_PASSWORD is not set}
      RADARR_URL: ${APP_MATHIEU_VITALS_RADARR_URL:-}
      RADARR_API_KEY: ${APP_MATHIEU_VITALS_RADARR_API_KEY:-}
      SONARR_URL: ${APP_MATHIEU_VITALS_SONARR_URL:-}
      SONARR_API_KEY: ${APP_MATHIEU_VITALS_SONARR_API_KEY:-}
      PROWLARR_URL: ${APP_MATHIEU_VITALS_PROWLARR_URL:-}
      PROWLARR_API_KEY: ${APP_MATHIEU_VITALS_PROWLARR_API_KEY:-}
      BAZARR_URL: ${APP_MATHIEU_VITALS_BAZARR_URL:-}
      BAZARR_API_KEY: ${APP_MATHIEU_VITALS_BAZARR_API_KEY:-}
      SEERR_URL: ${APP_MATHIEU_VITALS_SEERR_URL:-}
      SEERR_API_KEY: ${APP_MATHIEU_VITALS_SEERR_API_KEY:-}
      TRANSMISSION_URL: ${APP_MATHIEU_VITALS_TRANSMISSION_URL:-}
      MAINTAINERR_URL: ${APP_MATHIEU_VITALS_MAINTAINERR_URL:-}
      HEALARR_URL: ${APP_MATHIEU_VITALS_HEALARR_URL:-}
      CLEANUPARR_URL: ${APP_MATHIEU_VITALS_CLEANUPARR_URL:-}
      TRACEARR_URL: ${APP_MATHIEU_VITALS_TRACEARR_URL:-}
    restart: on-failure
