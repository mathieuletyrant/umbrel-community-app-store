version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-seek_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$http_x_forwarded_proto $$seek_proto {
          ~^(?<first>https?)  $$first;
          default             http;
        }
        server {
          listen 80;
          client_max_body_size 10m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-seek_server_1:8100;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header X-Forwarded-Proto $$seek_proto;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/nerdspar/seek:sha-71e0595@sha256:ce82524b4daeea1d2e9a834ae57995e9fd78db8d5e2347a7d2c6d05308035f98
    restart: on-failure
    environment:
      TZ: Etc/UTC
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    volumes:
      - ${APP_DATA_DIR}/data/seek:/data
