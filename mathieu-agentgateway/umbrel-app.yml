version: "1.7.0"
port: 15080
description: >-
  agentgateway is an open-source gateway for AI agents, hosted by the Linux
  Foundation. Here it gathers your MCP servers behind a single endpoint, so an
  AI assistant (Claude, ChatGPT, Home Assistant or any MCP client) is
  configured once and sees the tools of every server.


  It passes the client's own capabilities through to each server, so MCP Apps
  (interactive cards rendered by Claude and other hosts) keep working behind
  the gateway, and it rewrites their `ui://` resources so each one still
  reaches the right server. A server that is down is skipped instead of
  taking the others with it. Its web UI edits listeners, routes, backends and
  policies, and has a playground to test them.


  🛠️ SETUP INSTRUCTIONS


  1. Open the app and go to MCP → Servers. The endpoint has no MCP server
  yet: add one per server, with its address and, as backend auth, its
  bearer token (a `?token=` in the address is dropped, it never reaches the
  server). agentgateway refuses host names with an underscore, so the
  Umbrel container names (`mathieu-arr-mcp_server_1`) don't resolve: reach
  each app through its port on the Umbrel, e.g. arr-mcp at
  `http://host.docker.internal:6061/mcp`, MCP Memory at
  `http://host.docker.internal:6363/mcp`, Crawl4AI as an SSE target at
  `http://host.docker.internal:11235/mcp/sse`, umbrelOS at
  `http://host.docker.internal/mcp` with a `umbrelmcp_` token. Remote HTTP and
  SSE servers only: the image ships no `npx` or `uvx` for STDIO servers.


  2. Point your MCP client at `http://umbrel.local:15080/mcp?api_key=<key>`
  (Streamable HTTP) or `/sse?api_key=<key>`, where the key is this app's
  default password. Tool names are prefixed with the target name
  (`arr_get_library`). The web UI stays behind your Umbrel login; only `/mcp`
  and `/sse` are opened, and they refuse any request without the key.
