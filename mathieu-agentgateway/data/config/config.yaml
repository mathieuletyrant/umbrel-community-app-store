# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 3000
mcp:
  gateways: default
  failureMode: failOpen
  policies:
    apiKey:
      mode: strict
      location:
        queryParameter:
          name: api_key
      keys:
      - key: $API_KEY
  targets: []
