version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-crawl4ai_server_1
      APP_PORT: 11235
      PROXY_AUTH_WHITELIST: "/mcp/*,/health"

  server:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    restart: on-failure
    shm_size: 1gb
    environment:
      TZ: Etc/UTC
      CRAWL4AI_API_TOKEN: ${APP_PASSWORD}
