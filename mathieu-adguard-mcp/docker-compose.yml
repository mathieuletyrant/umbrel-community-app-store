version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-adguard-mcp_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/mcp*,/health"

  web:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    init: true
    environment:
      MCP_TOKEN: ${APP_PASSWORD:?APP_PASSWORD is not set}
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$arg_token $$token_auth {
          ""      $$http_authorization;
          default "Bearer $$arg_token";
        }
        server {
          listen 80;
          root /usr/share/nginx/html;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-adguard-mcp_server_1:3000;

          location ~ ^/mcp/?$$ {
            default_type application/json;
            set $$auth $$token_auth;
            if ($$auth != "Bearer __MCP_TOKEN__") {
              return 401 '{"error":"invalid or missing token"}';
            }
            set $$args "";
            proxy_pass $$upstream/;
            proxy_set_header Authorization "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_intercept_errors on;
            error_page 502 504 =503 @offline;
          }

          location = /health {
            default_type application/json;
            proxy_pass $$upstream/health;
            proxy_intercept_errors on;
            error_page 502 504 =503 @offline;
          }

          location @offline {
            default_type application/json;
            return 503 '{"error":"not connected to AdGuard Home: set your AdGuard Home username and password in the app settings in umbrelOS"}';
          }
        }
        CONF
        sed -i "s/__MCP_TOKEN__/$$MCP_TOKEN/" /etc/nginx/conf.d/default.conf
        cat > /usr/share/nginx/html/index.html <<'HTML'
        <!doctype html><html lang="en"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>AdGuard MCP</title>
        <style>body{font-family:system-ui,sans-serif;max-width:680px;margin:10vh auto;padding:0 24px;line-height:1.6;color:#e8e8ef;background:#15161c}code{background:#262833;padding:2px 6px;border-radius:4px;word-break:break-all}h1{margin-bottom:.2em}#status{padding:8px 14px;border-radius:6px;background:#262833}.ok{border-left:3px solid #67b279}.ko{border-left:3px solid #f5a623}</style>
        </head><body>
        <h1>🛡️ AdGuard MCP</h1>
        <p>Lets your AI assistant read and manage the AdGuard Home app of this Umbrel: query log, statistics, blocked services, filtering rules, DNS rewrites, clients…</p>
        <p id="status">Checking the connection to AdGuard Home…</p>
        <h3>Setup</h3>
        <ol>
        <li>In umbrelOS, open this app's settings and fill in your AdGuard Home username and password. The app reconnects on its own.</li>
        <li>Point your MCP client at <code class="url">/mcp</code> with the header <code>Authorization: Bearer &lt;token&gt;</code>, or at <code class="url" data-q="?token=&lt;token&gt;">/mcp?token=</code> for clients that can't send headers, like Home Assistant.</li>
        <li>The token is the password shown in this app's settings in umbrelOS (Default credentials).</li>
        </ol>
        <script>
        for (const el of document.querySelectorAll(".url")) el.innerHTML = location.protocol + "//" + location.host + "/mcp" + (el.dataset.q ?? "");
        const s = document.getElementById("status");
        fetch("health").then(r => r.json().then(b => [r.ok, b])).then(([ok, b]) => {
          s.className = ok ? "ok" : "ko";
          s.textContent = ok ? "✅ Connected to AdGuard Home" : "⚠️ Not connected to AdGuard Home yet: set your AdGuard Home username and password in this app's settings in umbrelOS.";
        }).catch(() => { s.className = "ko"; s.textContent = "⚠️ Not connected to AdGuard Home yet."; });
        </script>
        </body></html>
        HTML
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/samik081/mcp-adguard-home:0.10.1@sha256:8b99f6c1be373537ae0ac08b607a6f7b43086b77ed20bdc0a5b0964fa7e3c9ff
    init: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        until node dist/index.js; do
          echo "adguard-mcp: AdGuard Home unreachable or credentials refused, set them in the app settings in umbrelOS; retrying in 30s" >&2
          sleep 30
        done
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      ADGUARD_URL: http://host.docker.internal:8095
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
    restart: on-failure
