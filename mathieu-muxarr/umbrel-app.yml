releaseNotes: >-
  Sonarr and Radarr are now told about a converted file, rescan it and rename it when their naming format changed, and Muxarr follows the new name. Autoscan now really scans on its interval. New: GET /api/conversions, a filePath field in webhook notifications and Telegram forum topics. A late cancel no longer flips a finished conversion to cancelled.


  Full release notes can be found at https://github.com/KirovAir/muxarr/releases/tag/v0.9.11
