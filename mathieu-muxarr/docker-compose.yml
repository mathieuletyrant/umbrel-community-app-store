version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-muxarr_server_1
      APP_PORT: 8183

  server:
    image: ghcr.io/kirovair/muxarr:0.9.11@sha256:0268133c8e6ad9ba13e055ae24194bab3da8fe715ba2a3a19559f418c18e75a3
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
