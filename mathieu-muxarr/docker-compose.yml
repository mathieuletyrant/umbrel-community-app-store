version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-muxarr_server_1
      APP_PORT: 8183

  server:
    image: ghcr.io/kirovair/muxarr:0.9.10@sha256:97ef739d15a3145059309fd1ce236d7ffedbc6e9c5a820f32e4739d51948fb8d
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
