version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-muxarr_server_1
      APP_PORT: 8183

  server:
    image: ghcr.io/kirovair/muxarr:0.9.13@sha256:95e3141156bbe18e2d8e7f3036a9b110fad2eda9ede3f82640c6ecff87bc877f
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
