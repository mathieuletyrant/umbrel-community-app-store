version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-muxarr_server_1
      APP_PORT: 8183

  server:
    image: ghcr.io/kirovair/muxarr:0.9.12@sha256:42ac4d69d3fff77da94a1b7b544a05a8ea3c16a79d77e2f3558b0959d239f341
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
