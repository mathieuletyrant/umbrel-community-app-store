releaseNotes: >-
  Adds Seerr watchlist rules. Sonarr now matches episodes by their file first, Plex metadata is no longer augmented during rule evaluation, and TVDB logins recover after a failure and no longer block startup when TVDB is unreachable. The image moves to Node 26.12.1 with patched Alpine packages (security update).


  Full release notes can be found at https://github.com/Maintainerr/Maintainerr/releases/tag/v3.31.0
