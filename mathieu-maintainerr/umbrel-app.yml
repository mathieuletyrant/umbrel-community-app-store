releaseNotes: >-
  Maintainerr now starts correctly when the TZ variable is empty, and Sonarr and Radarr tag rules skip items whose tags cannot be read instead of evaluating them wrongly. The Tracearr connection test now uses the /servers endpoint, which requires Tracearr 2.7.0. Dependency updates.


  Full release notes can be found at https://github.com/Maintainerr/Maintainerr/releases/tag/v3.30.2
