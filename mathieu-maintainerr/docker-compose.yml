version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-maintainerr_server_1
      APP_PORT: 6246

  server:
    image: ghcr.io/maintainerr/maintainerr:3.26.0@sha256:0ff47e2465704ceb90cd79a1516844bc1c74f6c8eef8317988618a01e5a680ea
    init: true
    environment:
      - TZ=Europe/Paris
