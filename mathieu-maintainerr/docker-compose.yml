version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-maintainerr_server_1
      APP_PORT: 6246

  server:
    image: ghcr.io/maintainerr/maintainerr:3.27.0@sha256:64160eefe3a98a94fdbf8037b607ed7780a2fd95be233ef112c19e67a9bda638
    init: true
    environment:
      - TZ=Europe/Paris
    volumes:
      - ${APP_DATA_DIR}/data/opt-data:/opt/data
    restart: on-failure
