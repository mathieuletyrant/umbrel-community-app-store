version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-posterizarr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/fscorrupt/posterizarr:3.3.7@sha256:34b7be6e380dbd68811fbd594807883ffe74d440f73dc6259fb95e06b323d9d7
    user: "1000:1000"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      TERM: xterm
      RUN_TIME: disabled
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/assets:/assets
      - ${APP_DATA_DIR}/data/assetsbackup:/assetsbackup
      - ${APP_DATA_DIR}/data/manualassets:/manualassets
