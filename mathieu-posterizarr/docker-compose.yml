version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-posterizarr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/fscorrupt/posterizarr:4.0.0@sha256:d4aa2958a310904df9d612c75830cadca0f3da23aae204cedfe47ffe5aeef3df
    user: "1000:1000"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      TERM: xterm
      RUN_TIME: disabled
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/assets:/assets
      - ${APP_DATA_DIR}/data/assetsbackup:/assetsbackup
      - ${APP_DATA_DIR}/data/manualassets:/manualassets
