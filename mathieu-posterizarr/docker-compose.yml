version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-posterizarr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/fscorrupt/posterizarr:4.0.2@sha256:e77100303ed24cbe94c72c7d88629899771cc9e1483e6b22edd22fdf0105ed35
    user: "1000:1000"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      TERM: xterm
      RUN_TIME: disabled
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/assets:/assets
      - ${APP_DATA_DIR}/data/assetsbackup:/assetsbackup
      - ${APP_DATA_DIR}/data/manualassets:/manualassets
