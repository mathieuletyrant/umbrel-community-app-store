version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-posterizarr_server_1
      APP_PORT: 8000

  server:
    image: ghcr.io/fscorrupt/posterizarr:4.0.3@sha256:cd174c7853f9b6825b11bf845348af9d80f17a2046d6a86202afaf136090c708
    user: "1000:1000"
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      TERM: xterm
      RUN_TIME: disabled
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/assets:/assets
      - ${APP_DATA_DIR}/data/assetsbackup:/assetsbackup
      - ${APP_DATA_DIR}/data/manualassets:/manualassets
