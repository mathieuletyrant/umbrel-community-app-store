description: >-
  Kapowarr brings the *arr workflow to comic books. Add volumes to your
  library and it automatically searches, downloads, renames, moves and
  converts issues — with support for extracting archives and customising
  the file structure and format.


  It matches your library against ComicVine metadata and downloads directly
  from built-in sources like GetComics, so it works out of the box without a
  separate indexer or download client (external torrent clients are also
  supported).


  🛠️ SETUP INSTRUCTIONS


  1. Get a free ComicVine API key (comicvine.gamespot.com/api) and enter it
  in Settings > General.

  2. Add a root folder in Settings > Media Management — your shared media
  storage is mounted at /downloads, so use e.g. `/downloads/comics`.

  3. Add volumes to your library and let Kapowarr search for them.
