manifestVersion: 1
id: mathieu-lingarr
storage:
  dataRoot: data
category: media
name: Lingarr
tagline: Automated subtitle translation for Radarr/Sonarr
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-lingarr/icon.png
# renovate: datasource=docker depName=ghcr.io/lingarr-translate/lingarr
version: "1.3.0-patch.2"
port: 9876
description: >-
  Lingarr is an automated subtitle translator for Radarr and Sonarr. It
  translates your subtitle files into the language you want — perfect for
  getting French subtitles when a release only ships with English (or another
  language).


  It integrates with Radarr and Sonarr to know your library, and translates
  using either a self-hosted engine (LibreTranslate) or a SaaS service (DeepL,
  OpenAI, Google, Gemini, and more) via an API key. Translated subtitles are
  written right next to your media files.


  🛠️ SETUP INSTRUCTIONS


  Radarr and Sonarr installed from the Umbrel App Store are connected
  automatically: Lingarr reads their API keys each time it starts. If you
  install one of them after Lingarr, restart Lingarr.


  Then open Lingarr and:

  1. Pick a translation service — point it at a LibreTranslate instance, or add
  an API key for DeepL / OpenAI / Google / Gemini.

  2. Set your source and target languages (e.g. English → French) and enable
  automation.


  Your media is mounted at /downloads, matching the paths the *arr apps report,
  so no path mapping is needed.
developer: Lingarr
website: https://github.com/lingarr-translate/lingarr
submitter: Mathieu Le Tyrant
submission: https://github.com/lingarr-translate/lingarr
repo: https://github.com/lingarr-translate/lingarr
support: https://github.com/lingarr-translate/lingarr/issues
gallery: []
releaseNotes: >-
  Radarr and Sonarr from the Umbrel App Store are now connected automatically:
  Lingarr picks up their API keys at startup, no copy-paste needed.


  Also fixes Lingarr 1.3.0 failing to start ("DB_CONNECTION is not set").


dependencies: []
