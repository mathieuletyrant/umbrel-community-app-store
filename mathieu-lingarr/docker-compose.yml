version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lingarr_server_1
      APP_PORT: 9876

  server:
    image: ghcr.io/lingarr-translate/lingarr:1.3.0@sha256:12473f6f40beac1bb91ffadc7d8c7f1c2a0cd99ba336e4bf2c1dfa617c27a763
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
      - ASPNETCORE_URLS=http://+:9876
      - DB_CONNECTION=sqlite
      - RADARR_URL=${APP_MATHIEU_LINGARR_RADARR_URL:-}
      - RADARR_API_KEY=${APP_MATHIEU_LINGARR_RADARR_API_KEY:-}
      - SONARR_URL=${APP_MATHIEU_LINGARR_SONARR_URL:-}
      - SONARR_API_KEY=${APP_MATHIEU_LINGARR_SONARR_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
