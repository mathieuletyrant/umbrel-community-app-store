version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-lingarr_server_1
      APP_PORT: 9876

  server:
    image: ghcr.io/lingarr-translate/lingarr:1.5.0@sha256:c448e581e0970525f6b29aad7db9e9389efe99d30e08b91498fddac68e831261
    user: "1000:1000"
    init: true
    environment:
      - TZ=Etc/UTC
      - ASPNETCORE_URLS=http://+:9876
      - DB_CONNECTION=sqlite
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
