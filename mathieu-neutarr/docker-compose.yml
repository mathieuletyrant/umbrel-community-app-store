version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-neutarr_server_1
      APP_PORT: 9705

  server:
    image: iampuid0/neutarr:1.11.1@sha256:c3df05a854c93aac640708e002e8fe85193f73da8406c8a230a5484a342a1107
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
      NEUTARR_SETUP_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
