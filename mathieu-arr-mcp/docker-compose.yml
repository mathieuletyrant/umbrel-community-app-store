version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-arr-mcp_server_1
      APP_PORT: 6060
      PROXY_AUTH_WHITELIST: "/mcp*,/.well-known/*,/healthz"

  server:
    image: ghcr.io/bardesss/arr-mcp:1.83.1@sha256:0f13393a41e10f008f27fb2a3b998c258f0a008d53cf90030e841ad8ef82045f
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
