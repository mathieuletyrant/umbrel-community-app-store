version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-arr-mcp_server_1
      APP_PORT: 6060
      PROXY_AUTH_WHITELIST: "/mcp*,/.well-known/*,/healthz"

  server:
    image: ghcr.io/bardesss/arr-mcp:1.45.0@sha256:9d76b2b267d41cb99bde7f952d274a07a30d33fe7ff652f086dfe21e075dcf1c
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
