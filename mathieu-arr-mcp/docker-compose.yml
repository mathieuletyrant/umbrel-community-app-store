version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-arr-mcp_server_1
      APP_PORT: 6060
      PROXY_AUTH_WHITELIST: "/mcp*,/.well-known/*,/healthz"

  server:
    image: ghcr.io/bardesss/arr-mcp:1.47.0@sha256:0216e57aa911d7d1202b0dfcc4863477c494469e66f4f8b7f082da822b4b5cce
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
