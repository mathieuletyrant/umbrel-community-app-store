port: 6060
description: >-
  arr-mcp is a Model Context Protocol (MCP) server that lets an AI assistant
  (Claude, ChatGPT, or any MCP client) talk to your entire media stack through
  one endpoint: Radarr, Sonarr, Whisparr, Prowlarr, Bazarr, Jellyfin, Plex,
  Seerr, SABnzbd, Transmission, qBittorrent and Profilarr.


  Ask in plain language — "what's downloading and is anything stuck?", "why
  isn't the film I requested on Tuesday in Jellyfin yet?", "find French
  subtitles for the film that just landed" — and it correlates the services to
  answer. Its `diagnose` tool walks the whole chain (requested, monitored,
  downloaded, imported, scanned) and names the first step that broke.


  Writes are off by default and opt-in per service; every write is previewed,
  confirmed and recorded in an audit trail. Services are added from a built-in
  web page that tests each connection live — no YAML needed.


  🛠️ SETUP INSTRUCTIONS


  1. Open the app right after installing and claim it: the first page asks you
  to choose a username and a password (12+ characters). Until claimed, whoever
  opens it first owns the instance.

  2. Services already installed on your Umbrel are wired in automatically,
  API keys included: Radarr, Sonarr, Prowlarr, Bazarr, SABnzbd, Jellyseerr
  (or Overseerr), Transmission and Plex. An app installed later is picked up
  the next time arr-mcp restarts; a service you remove is not added back. Add
  anything else (Jellyfin, qBittorrent…) with "Add a service", or edit
  `~/umbrel/app-data/mathieu-arr-mcp/data/config/config.yaml` and restart.

  3. Point your MCP client at `http://umbrel.local:6060/mcp` with the bearer
  token shown on the dashboard (header `Authorization: Bearer <token>`). The
  web UI stays behind your Umbrel login; only `/mcp` is opened so MCP clients
  can reach it with the token.
