version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-notifiarr_server_1
      APP_PORT: 5454
      PROXY_AUTH_WHITELIST: "/plex"

  server:
    image: ghcr.io/notifiarr/notifiarr:v0.10.0@sha256:f83a85c60eebb21a446975a32d6ca4bc2f03226966d9eb8e46befdafb015f81e
    hostname: ${DEVICE_HOSTNAME:-umbrel}
    user: "1000:1000"
    restart: on-failure
    environment:
      TZ: Etc/UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
