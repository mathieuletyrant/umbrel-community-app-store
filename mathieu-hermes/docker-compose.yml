version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-hermes_server_1
      APP_PORT: 9119
      PROXY_AUTH_ADD: "false"

  server:
    image: nousresearch/hermes-agent:v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/hermes:/opt/data
    environment:
      TZ: Etc/UTC
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "admin"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${APP_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${APP_SEED}
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${APP_PASSWORD}
    command: ["gateway", "run"]
