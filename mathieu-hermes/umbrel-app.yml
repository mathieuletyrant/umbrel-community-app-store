manifestVersion: 1
id: mathieu-hermes
storage:
  dataRoot: data
category: ai
name: Hermes Agent
tagline: The self-improving AI agent, reachable from your phone
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-hermes/icon.png
# renovate: datasource=docker depName=nousresearch/hermes-agent
version: "0.22.5"
port: 18791
description: >-
  Hermes Agent by Nous Research is an AI agent that gets better the more you
  use it: it writes its own skills, remembers your preferences across
  sessions, runs scheduled tasks, browses the web, drives a terminal and talks
  to MCP servers. Chat with it from its web dashboard, from Telegram, Discord,
  Signal and other messaging apps, or from your phone.


  This version runs the official Hermes image as Nous publishes it, with
  Hermes's own dashboard and login, so the same address works from a browser,
  Hermes Desktop and mobile clients. Its OpenAI-compatible API is also on, for
  apps such as Open WebUI.


  🛠️ SETUP INSTRUCTIONS


  1. Open the app and sign in with the username and password shown in this
  app's settings in umbrelOS (Default credentials). The password is unique to
  your Umbrel.

  2. Open the Chat tab and run the setup wizard, or add your provider key
  (OpenRouter, Anthropic, OpenAI, Nous Portal…) in the Keys page and pick a
  model in Models.

  3. From your phone: in Hermex (iOS), add a Hermes dashboard server with
  `http://umbrel.local:18791` (or the address you reach your Umbrel by) and the
  same username and password. Hermes Desktop works the same way, in
  Settings → Gateways → Remote gateway. Outside your home network, use
  Tailscale or a tunnel to that address.

  4. Other apps on your Umbrel reach the OpenAI-compatible API at
  `http://mathieu-hermes_server_1:8642/v1`, with the default password as API
  key.


  Its data (config, keys, memory, skills, sessions) lives in its own app
  folder and is separate from the official Hermes Agent app.
developer: Nous Research
website: https://hermes-agent.nousresearch.com
submitter: Mathieu Le Tyrant
submission: https://github.com/mathieuletyrant/umbrel-community-app-store
repo: https://github.com/NousResearch/hermes-agent
support: https://github.com/NousResearch/hermes-agent/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-hermes/gallery-1.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-hermes/gallery-2.jpg
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-hermes/gallery-3.jpg
releaseNotes: >-
  Session auto-pruning is opt-in again: Hermes prompts when disk space is low
  instead of deleting old sessions. Agent importers, the MCP server and the
  Singularity backend now live in plugins, and chats no longer reset on idle or
  daily timers (use /new or /reset).


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.5
dependencies: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
environment:
  - name: TZ
    services:
      - server
    default: Etc/UTC
    note: Your time zone, e.g. Europe/Paris. Scheduled tasks run on it.
