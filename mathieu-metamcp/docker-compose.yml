version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-metamcp_server_1
      APP_PORT: 12008
      PROXY_AUTH_WHITELIST: "/metamcp/*,/.well-known/*,/oauth/*,/register,/health"

  server:
    image: ghcr.io/metatool-ai/metamcp:2.4.22@sha256:6d5e0cba4ffc4976069a980723c11042f993a978fe0f3071ba2ec8a91ebc3d41
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      NODE_ENV: production
      POSTGRES_HOST: mathieu-metamcp_db_1
      POSTGRES_PORT: 5432
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: metamcp
      POSTGRES_DB: metamcp
      DATABASE_URL: postgresql://metamcp:metamcp@mathieu-metamcp_db_1:5432/metamcp
      APP_URL: http://${DEVICE_DOMAIN_NAME}:12008
      NEXT_PUBLIC_APP_URL: http://${DEVICE_DOMAIN_NAME}:12008
      EXTRA_TRUSTED_ORIGINS: "*"
      BETTER_AUTH_SECRET: ${APP_SEED}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
      BOOTSTRAP_USER_EMAIL: umbrel@umbrel.local
      BOOTSTRAP_USER_NAME: umbrel
      BOOTSTRAP_USER_PASSWORD: ${APP_PASSWORD}
      BOOTSTRAP_ONLY_FIRST_RUN: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/nextjs

  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: metamcp
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: metamcp
      PGDATA: /data/pgdata
    healthcheck:
      test: "pg_isready -U metamcp -h localhost -d metamcp"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
