version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-metamcp_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/metamcp/*,/.well-known/*,/oauth/*,/register,/health"

  web:
    image: nginx:alpine@sha256:a3554c0d0b48177b1413c26e01f695334428020d9df01243fbae3e11cfd17417
    init: true
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ""      "";
        }
        server {
          listen 80;
          client_max_body_size 50m;
          resolver 127.0.0.11 valid=10s;
          set $$upstream http://mathieu-metamcp_server_1:12008;

          location / {
            proxy_pass $$upstream;
            proxy_set_header Host $$http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_cookie_domain ~.+ $$host;
          }
        }
        CONF
        exec nginx -g 'daemon off;'
    depends_on:
      - server
    restart: on-failure

  server:
    image: ghcr.io/metatool-ai/metamcp:2.4.22@sha256:6d5e0cba4ffc4976069a980723c11042f993a978fe0f3071ba2ec8a91ebc3d41
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Etc/UTC
      NODE_ENV: production
      npm_config_manage_package_manager_versions: "false"
      POSTGRES_HOST: mathieu-metamcp_db_1
      POSTGRES_PORT: 5432
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: metamcp
      POSTGRES_DB: metamcp
      DATABASE_URL: postgresql://metamcp:metamcp@mathieu-metamcp_db_1:5432/metamcp
      APP_URL: http://${DEVICE_DOMAIN_NAME}:12008
      EXTRA_TRUSTED_ORIGINS: "*"
      BETTER_AUTH_SECRET: ${APP_SEED}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/home:/home/nextjs

  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: metamcp
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: metamcp
      PGDATA: /data/pgdata
    healthcheck:
      test: "pg_isready -U metamcp -h localhost -d metamcp"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
