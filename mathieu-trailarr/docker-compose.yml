version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-trailarr_trailarr_1
      APP_PORT: 7889

  trailarr:
    image: nandyalu/trailarr:0.14.1@sha256:066eee5cce7358359d3ad5655dc61963b00a5d34a5bf9e9c2904c2acf987eb66
    environment:
      - TZ=Etc/UTC
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
