version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-trailarr_trailarr_1
      APP_PORT: 7889

  trailarr:
    image: nandyalu/trailarr:0.11.1@sha256:ae5a4fc43cd057d2354f6aa2c594d85675494bf5fa2e90d830614d3618b5b780
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Media mounted at the SAME path Sonarr/Radarr report (/downloads), so
      # Trailarr's path mappings are 1:1 and it writes trailers next to the media.
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    restart: on-failure
