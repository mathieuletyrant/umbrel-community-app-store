version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-trailarr_trailarr_1
      APP_PORT: 7889

  trailarr:
    image: nandyalu/trailarr:0.11.0@sha256:980e50eb10b10d5b660066a9b37921087fdc07649571134837974559d3a0e7bd
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Media mounted at the SAME path Sonarr/Radarr report (/downloads), so
      # Trailarr's path mappings are 1:1 and it writes trailers next to the media.
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    restart: on-failure
