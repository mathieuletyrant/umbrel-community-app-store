manifestVersion: 1
id: mathieu-healarr
storage:
  dataRoot: data
category: media
name: Healarr
tagline: Automated media library health monitoring and remediation
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-healarr/icon.png
# renovate: datasource=docker depName=ghcr.io/mescon/healarr
version: "1.3.17-patch.1"
port: 3090
description: >-
  Healarr is a media library health monitoring system. It detects issues in your
  media files using ffprobe, MediaInfo, or HandBrake, then orchestrates the
  complete remediation workflow.


  When a corrupted or unhealthy file is found, Healarr automatically triggers a
  re-download through Sonarr, Radarr, or Whisparr, and verifies the replacement
  is healthy.


  🛠️ SETUP INSTRUCTIONS


  After launching Healarr, open the web interface and set your password. Then
  point Healarr at your *arr apps (Sonarr/Radarr/Whisparr) and configure which
  library paths to scan. Your media is mounted read-only at /downloads, matching
  the paths the *arr apps report.
developer: mescon
website: https://github.com/mescon/Healarr
submitter: Mathieu Le Tyrant
submission: https://github.com/mescon/Healarr
repo: https://github.com/mescon/Healarr
support: https://github.com/mescon/Healarr/issues
gallery:
  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-healarr/gallery-1.jpg
releaseNotes: >-
  This update adds support for the new storage management and configuration options introduced with umbrelOS 2.0, and restores the standard shared Downloads mount path so the app works on every umbrelOS version.


  Previous release notes:


  Initial release of Healarr for this Community App Store.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
