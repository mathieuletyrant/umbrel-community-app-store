releaseNotes: >-
  Bug-fix release. Log rolling is now on by default, Emby programs get external
  links, and anamorphic video keeps the right aspect ratio. Fixes for VAAPI
  tone-mapping, a hang in the ffmpeg gcd helper, HLS default audio, NFO
  scanning and movie artwork, and shuffle and random slots now use the seeded
  random. Stored language codes are normalised to ISO 639-2/T.


  Full release notes can be found at https://github.com/chrisbenincasa/tunarr/releases/tag/v2026.10.3
