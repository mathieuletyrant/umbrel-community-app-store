version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-tunarr_server_1
      APP_PORT: 8000
      PROXY_AUTH_WHITELIST: "/device.xml,/discover.json,/lineup.json,/lineup_status.json,/stream/*,/streams/*,/api/channels.m3u,/api/xmltv.xml"

  server:
    image: ghcr.io/chrisbenincasa/tunarr:2026.10.3@sha256:18c475cc6b6abcc8aff267789e3f56fe9fbd0ea08e36919accfe7fdf42034b63
    environment:
      - TZ=Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config/tunarr
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
    restart: on-failure
