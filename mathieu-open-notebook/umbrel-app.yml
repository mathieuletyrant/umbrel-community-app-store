description: >-
  Open Notebook is an open-source, self-hosted alternative to Google's
  NotebookLM. Gather your sources in notebooks (PDFs, web pages, YouTube
  videos, audio, Office files, plain text), then chat with them, ask
  questions answered with citations, write notes and run transformations
  such as summaries or key insights.


  It also turns a notebook into a podcast: an AI writes the script and up to
  four speakers read it aloud, with profiles you can tune (tone, length,
  voices).


  You pick the AI behind it: OpenAI, Anthropic, Google, Mistral, Groq,
  OpenRouter, DeepSeek, ElevenLabs, or local models through Ollama or any
  OpenAI-compatible server. Your sources and notes stay on your Umbrel.


  🛠️ SETUP INSTRUCTIONS


  1. Open the app, go to Manage → Models and add a credential for your AI
  provider (an API key, or the address of your Ollama server, e.g.
  `http://ollama_ollama_1:11434` for the Ollama app of the Umbrel App
  Store). Keys are stored encrypted.

  2. On the same page, choose the default models: a language model for chat
  and an embedding model for search. Podcasts also need a text-to-speech
  model (OpenAI, ElevenLabs or Google, for example).

  3. Create a notebook, add sources, and start asking questions.
