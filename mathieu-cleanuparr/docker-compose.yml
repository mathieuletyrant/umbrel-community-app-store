version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-cleanuparr_server_1
      APP_PORT: 11011

  server:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.8@sha256:ec444338a67e429a20f6eef938e1ed771ce357ed4831765026096061a09bbbb7
    init: true
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Downloads dir (same path the *arr apps use) so Cleanuparr can check
      # hardlinks for its orphaned / unlinked-download cleanup. Host path is
      # umbrelOS's shared home/Downloads folder used by this setup's *arr apps.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
