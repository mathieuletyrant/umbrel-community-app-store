version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-cleanuparr_server_1
      APP_PORT: 11011

  server:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.7@sha256:8bc918de0131502d0bd9b78b3c7821ae3455e8c8b4ae9006b9ddfbbd6db529d7
    init: true
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # Downloads dir (same path the *arr apps use) so Cleanuparr can check
      # hardlinks for its orphaned / unlinked-download cleanup. Host path is
      # umbrelOS's shared home/Downloads folder used by this setup's *arr apps.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    restart: on-failure
