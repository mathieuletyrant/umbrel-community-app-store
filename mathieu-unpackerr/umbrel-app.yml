manifestVersion: 1
id: mathieu-unpackerr
storage:
  dataRoot: data
category: media
name: Unpackerr
tagline: Extract archived downloads so Radarr, Sonarr and Lidarr can import them
icon: https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-unpackerr/icon.png
# renovate: datasource=docker depName=ghcr.io/unpackerr/unpackerr
version: "0.16.1-patch.1"
port: 5657
description: >-
  Some releases arrive as .rar, .7z or .zip archives instead of a playable
  file. Radarr, Sonarr and Lidarr can't import those, so the download sits in
  their queue forever with "No files found are eligible for import".


  Unpackerr fixes that automatically: it polls the queues of your *arr apps,
  extracts every completed download that contains archives (multi-part and
  nested archives included), lets the app import the result, then deletes the
  extracted copy so only the original torrent keeps seeding.


  🛠️ SETUP INSTRUCTIONS


  Paste the API key of Radarr, Sonarr and/or Lidarr (Settings → General in each
  app) in Unpackerr's settings in umbrelOS (⋯ → Settings → Advanced settings).
  Their addresses default to the apps of the Umbrel App Store.


  Unpackerr runs in the background. Opening the app shows a status page with
  the connected apps, extraction counters and recent activity.
developer: Go Lift
website: https://unpackerr.zip
submitter: Mathieu Le Tyrant
submission: https://github.com/Unpackerr/unpackerr
repo: https://github.com/Unpackerr/unpackerr
support: https://github.com/Unpackerr/unpackerr/issues
gallery: []
releaseNotes: >-
  The API keys of Radarr, Sonarr and Lidarr are no longer read from those apps:
  paste them in Unpackerr's settings in umbrelOS.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
environment:
  - name: UN_RADARR_0_URL
    services:
      - server
    default: http://radarr_server_1:7878
    note: Radarr's address. http://radarr_server_1:7878 is the Radarr app of the Umbrel App Store.
  - name: UN_RADARR_0_API_KEY
    services:
      - server
    note: Radarr's API key, from Radarr → Settings → General. Leave empty to skip Radarr.
  - name: UN_SONARR_0_URL
    services:
      - server
    default: http://sonarr_server_1:8989
    note: Sonarr's address. http://sonarr_server_1:8989 is the Sonarr app of the Umbrel App Store.
  - name: UN_SONARR_0_API_KEY
    services:
      - server
    note: Sonarr's API key, from Sonarr → Settings → General. Leave empty to skip Sonarr.
  - name: UN_LIDARR_0_URL
    services:
      - server
    default: http://lidarr_server_1:8686
    note: Lidarr's address. http://lidarr_server_1:8686 is the Lidarr app of the Umbrel App Store.
  - name: UN_LIDARR_0_API_KEY
    services:
      - server
    note: Lidarr's API key, from Lidarr → Settings → General. Leave empty to skip Lidarr.
permissions:
  - STORAGE_DOWNLOADS
