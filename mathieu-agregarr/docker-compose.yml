version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-agregarr_server_1
      APP_PORT: 7171

  server:
    image: bitr8/agregarr:2.12.0@sha256:a552c72a11ea2497cb31084a45aba620e93fdab3a06351921dfd45716732b840
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
