version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-agregarr_server_1
      APP_PORT: 7171

  server:
    image: bitr8/agregarr:2.12.3@sha256:fe50b7d232e802622ff38b0f963d9cbc4f1a6d83dbc150d8bf86b528de3ac836
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
