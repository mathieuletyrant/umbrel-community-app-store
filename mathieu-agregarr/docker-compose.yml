version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-agregarr_server_1
      APP_PORT: 7171

  server:
    image: bitr8/agregarr:2.12.1@sha256:e6bf501a39885d21dfc1b6ad769cb496b0227e06000bd6d426e0a768d2b6a14f
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
