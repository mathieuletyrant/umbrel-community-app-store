version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-agregarr_server_1
      APP_PORT: 7171

  server:
    image: bitr8/agregarr:2.13.0@sha256:39169a4bd349016c13d2bbb15d46dde0357ae86d8658bbba150e743a7a77925b
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
