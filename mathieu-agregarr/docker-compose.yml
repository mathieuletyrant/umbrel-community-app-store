version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-agregarr_server_1
      APP_PORT: 7171

  server:
    image: bitr8/agregarr:2.13.1@sha256:07e6ebdaffb59df7e3dee4537468cb46f3d2784ff07960ef03c7520d4bb737fd
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Etc/UTC
      PUID: 1000
      PGID: 1000
      UMASK: "022"
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
