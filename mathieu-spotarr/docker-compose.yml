version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-spotarr_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/spotarr:0.12.0@sha256:a2f5cc046d5d4fcb8fb36ff96b8156b6750adca84ceb11c721471a9b4c2de5c2
    user: "1000:1000"
    environment:
      API_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/spotarr:/data
    restart: on-failure
