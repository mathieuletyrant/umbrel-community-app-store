version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-spotarr_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/spotarr:0.8.0@sha256:421adf92088bc3f5a19d6df32900886e3e10b8a752a14bbed0dedcb69cf451bb
    user: "1000:1000"
    environment:
      API_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/spotarr:/data
    restart: on-failure
