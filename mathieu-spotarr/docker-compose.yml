version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-spotarr_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/spotarr:0.15.0@sha256:97044da21d81ecf4f47c91711034c1fa9f4f2170f2a5356c2e6cc9f27e538c13
    user: "1000:1000"
    environment:
      API_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/spotarr:/data
    restart: on-failure
