version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-spotarr_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/spotarr:0.17.1@sha256:0a2544eb60fe79b408ffa6d417effd253e2039a03e19f128bbb6b4eb58d86d5b
    user: "1000:1000"
    environment:
      API_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/spotarr:/data
    restart: on-failure
