version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: mathieu-spotarr_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/mathieuletyrant/spotarr:0.6.0@sha256:d6f99052d626dfc1fd1e6828869e49efac54bbaede32fa248fc5f6e16aa2f3b5
    user: "1000:1000"
    environment:
      API_TOKEN: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/spotarr:/data
    restart: on-failure
