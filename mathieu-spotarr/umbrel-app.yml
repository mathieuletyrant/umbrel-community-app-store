  - https://raw.githubusercontent.com/mathieuletyrant/umbrel-community-app-store/master/mathieu-spotarr/gallery-2.jpg
releaseNotes: >-
  Share any link, not only reels: web pages are now read with their text and
  pictures, and the movie or show they mention is identified like a reel.
  The iOS Shortcut import is fixed (a complete If action and labelled Text
  actions).


  Full release notes can be found at https://github.com/mathieuletyrant/spotarr/releases/tag/v0.9.0
dependencies: []
